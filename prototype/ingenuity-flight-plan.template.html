<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Plan</title>
<!-- Prototype. Generated by tools/make_ingenuity_sprites.mjs from ingenuity-flight-plan.template.html: edit the template. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Jersey+15&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1b1433; --night2: #2e2357; --panel: #261c48; --ink: #f6f0ff; --muted: #b9acdf;
    --pink: #ff7ad9; --cyan: #7ff7ff; --lime: #b8ff7a; --yellow: #fff27a; --lav: #c6a8ff; --orange: #ffab6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font-family: "Jersey 15", system-ui, sans-serif; font-size: 20px; font-variant-ligatures: none;
    background:
      radial-gradient(2px 2px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(2px 2px at 78% 12%, #7ff7ffaa 50%, transparent 51%),
      radial-gradient(2px 2px at 44% 82%, #ff7ad9aa 50%, transparent 51%),
      radial-gradient(2px 2px at 90% 70%, #fff8 50%, transparent 51%),
      linear-gradient(180deg, #1b1433 0%, #2a1d52 60%, #3b2266 100%);
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: var(--ink); }
  button:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }

  /* ---------- the board (the canvas is a whole-number multiple of its game pixels: see fit()) ---------- */
  canvas#game { border-radius: 14px; box-shadow: 0 0 0 3px #7ff7ff55, 0 0 40px #ff7ad944; background: var(--night); }
  .card { background: #261c48cc; border: 0; border-radius: 16px; padding: var(--card-pad); }
  .label { color: var(--muted); font-size: var(--fs-label); margin: 0; }
  .label:empty { display: none; }

  /* ---------- your plan: filled steps are buttons (tap one to change it), empty steps are information ---------- */
  .planhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
  .planhead .heat { padding: 4px 10px; display: inline-flex; align-items: center; gap: 10px; }
  .heat .pips { display: inline-flex; gap: 3px; align-items: center; }
  .heat i { width: 8px; height: 16px; border-radius: 2px; background: #ffffff1c; display: inline-block; }
  .heat i.on { background: var(--orange); }
  .heat i.on.hot { background: #ff5c5c; }
  .plan { display: grid; grid-template-columns: repeat(9, 52px); gap: 6px; }
  .slot { width: 52px; height: 52px; padding: 0; line-height: 1; position: relative; color: var(--accent, var(--ink)); background: #ffffff14; }
  .slot.empty { border: 0; border-radius: var(--radius); background: #00000033; box-shadow: none; cursor: default; }
  .slot.F { --accent: var(--lime); } .slot.L, .slot.R { --accent: var(--lav); } .slot.C { --accent: var(--yellow); }
  .slot.is-sel { color: #1b1433; }
  .slot.run { box-shadow: 0 0 18px currentColor; transform: translateY(-3px); }
  .slot.bad { border-color: var(--orange); background: #ffab6b30; }
  .slot.bad::after { content: "✕"; position: absolute; right: -8px; top: -8px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    font: 700 16px/1 var(--font-read); background: var(--orange); color: #1b1433; }
  .slot.dim { opacity: .3; }
  .slot svg { width: 28px; height: 28px; display: block; margin: auto; }
  .deg { position: absolute; right: 3px; bottom: 2px; font: 700 16px/1 var(--font-read); color: currentColor; pointer-events: none; }
  .note { min-height: 26px; margin: 8px 0 0; font-size: var(--fs-small); line-height: 1.3; color: var(--lav); }
  .note:empty { min-height: 0; margin: 0; }

  /* ---------- the controls: four move keys and a tall GO on top, Undo / Clear / Hint below ---------- */
  .controls { display: grid; grid-template-columns: repeat(4, 88px) minmax(0, 1fr); grid-template-rows: 64px var(--h-btn-tool); gap: 8px; }
  .controls .pad, .controls .actions { display: contents; }
  .controls .actions > div { grid-column: 1 / span 4; grid-row: 2; display: flex; gap: 8px; }   /* Undo / Clear / Hint: one width each */
  .key { width: 100%; height: 100%; padding: 0; min-width: 0; color: var(--accent); background: #ffffff10; }
  .key svg { width: 40px; height: 40px; display: block; margin: auto; }
  .key .deg { right: 5px; bottom: 4px; }
  .key.L svg, .key.R svg { width: 38px; height: 38px; margin: 5px auto 0; }   /* leave the corner for the 90° label */
  .slot.L svg, .slot.R svg { width: 26px; height: 26px; margin: 5px auto 0; }
  .key.L { grid-column: 1; grid-row: 1; --accent: var(--lav); }
  .key.F { grid-column: 2; grid-row: 1; --accent: var(--lime); }
  .key.R { grid-column: 3; grid-row: 1; --accent: var(--lav); }
  .key.C { grid-column: 4; grid-row: 1; --accent: var(--yellow); }
  .key.flash { transform: translateY(2px); box-shadow: 0 1px 0 var(--depth); filter: brightness(1.4); }
  .key.nudge { animation: nudge .5s ease-in-out infinite alternate; }
  @keyframes nudge { to { transform: rotate(14deg) scale(1.08); } }
  .point { animation: pointMe .6s ease-in-out infinite alternate; }   /* "press this one": a pulsing yellow ring, never over another control */
  @keyframes pointMe { from { outline: 3px solid #fff27a00; outline-offset: 2px; } to { outline: 4px solid var(--yellow); outline-offset: 5px; } }
  .controls .go { grid-column: 5; grid-row: 1 / span 2; height: auto; min-height: 0; padding: 0 12px; }
  .controls .toolbtn { flex: 1 1 0; height: var(--h-btn-tool); min-height: 0; padding: 0 4px; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* ---------- solved panel ---------- */
  .solved { text-align: center; }
  .solvedmsg { font-size: var(--fs-body); margin: 0 0 12px; }
  .solvedmsg .eq { font-family: var(--font-display); font-weight: 700; color: var(--lime); font-size: var(--fs-heading); }
  .solved .btn-next { height: var(--h-btn-primary); animation: nextGlow 1.3s ease-in-out infinite alternate; }
  @keyframes nextGlow { from { box-shadow: 0 5px 0 #2e8a49, 0 0 16px #b8ff7a77; } to { box-shadow: 0 5px 0 #2e8a49, 0 0 36px #b8ff7add; } }

  /* ---------- caption bar (sizes in house.css) ---------- */
  #portrait { border-radius: 12px; background: #2e2357; }
  .who { color: var(--cyan); font-weight: 700; }
  .dev { display: flex; gap: 6px; align-items: center; background: #000c; border: 2px dashed var(--yellow); color: var(--yellow); font: 14px system-ui, sans-serif; }
  .dev select, .dev button { font: 14px system-ui, sans-serif; }
  .err { position: fixed; left: 0; right: 0; top: 0; background: #b00020; color: #fff; padding: 8px; z-index: 9; }

  /* ---------- Part 3: the question, its answer tiles, and the fit button ---------- */
  .qbig { margin: 0 0 14px; font-size: var(--fs-heading); line-height: 1.2; font-weight: 700; color: var(--yellow); text-align: center; text-shadow: 0 0 10px #fff27a55; }
  .qbig.pop { animation: qIn .4s ease-out both; }
  .answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .answer { padding: 8px 8px 10px; background: #ffffff10; color: var(--ink); font-family: var(--font-read); font-size: var(--fs-body); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .answer canvas { width: 128px; height: 80px; image-rendering: pixelated; display: block; border-radius: 8px; background: #2e2357; }   /* 64 x 40 at 2x */
  .answer .n { position: absolute; left: -10px; top: -12px; width: 30px; height: 30px; border-radius: 50%; background: var(--lav); color: #1b1433; font: 700 18px/1 var(--font-read); display: grid; place-items: center; }
  .answer.right { --accent: var(--lime); background: #b8ff7a33; }
  .answer.wrong { animation: shake .35s; }
  .answer.crossed { opacity: .5; text-decoration: line-through; --accent: var(--orange); box-shadow: none; cursor: not-allowed; }
  .answers:not(.answered) .answer:not(.crossed) { animation: ansPulse 1.5s ease-in-out infinite; }
  .answers.fresh .answer:not(.crossed) { animation: ansIn .4s ease-out backwards, ansPulse 1.5s ease-in-out .4s infinite; }
  .answers.fresh .answer:nth-child(2) { animation-delay: .08s, .48s; } .answers.fresh .answer:nth-child(3) { animation-delay: .16s, .56s; }
  @keyframes qIn { from { opacity: 0; transform: translateY(-14px) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes ansIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes ansPulse { 0%, 100% { box-shadow: 0 4px 0 var(--depth), 0 0 0 0 #7ff7ff00; } 50% { box-shadow: 0 4px 0 var(--depth), 0 0 18px 2px #7ff7ffaa; } }
  .disc { font-size: var(--fs-small); color: var(--lav) !important; }
  @media (prefers-reduced-motion: reduce) {
    .solved .btn-next, .bd-label, .qbig, .answers .answer, .point, .key.nudge { animation: none !important; }
  }

  /* ---------- story time: photos and video only (the game canvas is hidden), on the shared st- chrome ---------- */
  .play.story-photos { grid-template-columns: minmax(0, 1fr) !important; align-items: stretch !important; }
  .play.story-photos .play-board { display: none; }
  .play.story-photos .play-ctrls { justify-content: stretch; }
  .play.story-photos #p3Panel { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .play.story-photos #p3Body { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  .st-body { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 16px; align-items: stretch; }
  .st-body.has-facts { grid-template-columns: 600px minmax(0, 1fr); }
  .st-body .facts-col { align-self: center; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .st-body .facts-col .fact-source { margin: 0; white-space: normal; }
  .st-body .facts-col .fact-source a { white-space: normal; }
  #app .st-body .facts .fact-value { font-size: var(--fs-body); line-height: 1.2; }
  #app .st-body .facts .fact-text { font-size: var(--fs-body); line-height: 1.25; }
  .st-body .facts { align-self: center; gap: 8px; }
  #app .st-body .facts .fact { padding: 8px 14px; gap: 12px; }
  .st-body .st-media { height: 100%; min-height: 0; padding: 4px; overflow: hidden; }
  .st-body .st-fig { height: 100%; justify-content: center; }
  .st-body .st-frame { flex: 0 1 auto; min-height: 0; display: flex; }
  .st-body .st-frame img, .st-body .st-frame video { max-height: 100%; height: auto; width: auto; }
  .st-top .badge { flex: none; }
  .st-fig { animation: evidence-land 440ms cubic-bezier(.2,.8,.25,1) both; }
  .st-fig:nth-child(2) { animation-delay: 100ms; }
  @keyframes evidence-land { 0% { opacity: 0; transform: translateY(-32px) scale(1.12) rotate(-7deg); } 68% { opacity: 1; transform: translateY(3px) scale(.97) rotate(2deg); } 100% { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .st-fig { animation: none; } }

  /* ---------- cards ---------- */
  .closex { position: absolute; right: -14px; top: -14px; width: 52px; height: 52px; border-radius: 50%; cursor: pointer;
    border: 4px solid #fff3d6; background: radial-gradient(circle at 35% 30%, #ffb07a, #f2672e); color: #fff;
    font: 700 26px/1 system-ui, sans-serif; box-shadow: 0 0 0 3px #1b1433, 0 4px 0 #1b1433, 0 0 18px #ff8a5c88; }
  .closex:hover { filter: brightness(1.1); transform: translateY(-2px); }
  .closex:active { transform: translateY(2px); }
  .closex:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }
  .overlay { display: grid; place-items: center; background: #1b1433dd; z-index: 5; }
  .overlay .box { position: relative; text-align: center; background: var(--panel); border: 3px solid var(--cyan); border-radius: 24px; padding: 24px 36px; box-shadow: 0 0 40px #7ff7ff55; max-width: 680px; }
  .overlay h2 { font-size: var(--fs-heading); margin: 0 0 8px; color: var(--cyan); text-shadow: 0 0 12px #7ff7ff; }
  .overlay p { color: var(--muted); margin: 0 0 16px; }
  .mcard { text-align: left !important; }
  .mcard h2 { text-align: center; }
  .mcard .row { display: flex; justify-content: center; margin-top: 16px; }
  .badge { display: inline-block; font-size: var(--fs-small); padding: 2px 10px; border-radius: 999px; background: #ff7ad933; color: var(--pink); }
  .plist { display: grid; gap: 8px; }
  .plist > div { display: grid; grid-template-columns: 1.2fr 1.4fr 30px; gap: 10px; align-items: center; padding: 8px 14px; border-radius: 12px; background: #ffffff10; font-family: var(--font-read); font-size: var(--fs-body); }
  .plist small { display: block; color: var(--muted); font-size: var(--fs-small); }
  .diff { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
  .diff i { width: 14px; height: 14px; border-radius: 3px; background: #ffffff22; display: inline-block; }
  .diff i.on { background: var(--pink); }
  .pinfo { display: flex; justify-content: center; font-family: var(--font-read); font-size: var(--fs-body); margin: 0 0 8px; }


  /* ---------- "Before you fly": the big explainer card (frame in house.css) ---------- */
  .bd-stage canvas { width: 448px; height: 352px; border-radius: 16px; border: 4px solid #1b1433; box-shadow: 0 0 0 3px var(--cyan), 0 0 26px #7ff7ff55; display: block; box-sizing: content-box; }   /* 112 x 88 at 4x */
  .bd-label.L, .bd-label.R { color: var(--lav); } .bd-label.F { color: var(--lime); } .bd-label.C { color: var(--yellow); }
  .mvtile canvas { width: 112px; height: 88px; }                  /* 112 x 88 at 1x */
  .mvtile.L, .mvtile.R { --accent: var(--lav); color: var(--lav); } .mvtile.F { --accent: var(--lime); color: var(--lime); } .mvtile.C { --accent: var(--yellow); color: var(--yellow); }
  .mvtile.on { color: #1b1433; }
  .bigcard .refs { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .rg { display: flex; align-items: center; gap: 14px; }
  .rh { font-family: var(--font-display); color: var(--cyan); font-weight: 700; font-size: var(--fs-body); }
  .rrow { display: flex; gap: 8px; }
  .bigcard .rrow figure { margin: 0; text-align: center; font-family: var(--font-read); line-height: 1.1; }
  .bigcard .rrow img { width: 80px; height: 80px; display: block; margin: 0 auto 3px; image-rendering: pixelated; background: #e8643c; border-radius: 10px; }   /* 40 x 40 at 2x */
  .rrow b { display: block; font-family: var(--font-read); color: var(--ink); }
  .bigcard .rrow .yes img { filter: drop-shadow(0 0 8px #fff27a); }
  .bigcard .rrow .yes, .bigcard .rrow .yes b { color: var(--yellow); font-weight: 700; }
  .fact-link { margin-left: 8px; font-family: var(--font-read); font-size: var(--fs-small); color: var(--cyan, #7ff7ff); white-space: nowrap; }
</style>

<body>
<div id="app" data-stage class="frame">
  <header class="hdr">
    <h1 class="hdr-title">Flight Plan</h1>
    <div class="hdr-ctrls">
      <button class="hbtn hbtn-mission" id="missionBtn" title="See your mission">Your mission</button>
      <button class="hbtn hbtn-icon" id="helpBtn" aria-label="How to play: Before you fly" title="How to play">?</button>
      <button class="hbtn" id="voiceBtn" aria-pressed="true" title="Voice on or off (V)">🔊 Voice</button>
      <button class="hbtn" id="restartBtn" hidden title="Start Ingenuity's story again">↺ Restart</button>
    </div>
  </header>
  <div class="stepbar" id="stepbar" aria-live="polite"><span class="step-text" id="stepText"></span><span class="step-sub" id="stepSub"></span></div>

  <main class="play">
    <div class="play-board"><canvas id="game" width="320" height="200" aria-label="Game scene"></canvas></div>

    <div class="play-ctrls">
      <section class="card" id="p2Panel" hidden>
        <div class="planhead"><p class="label">Your flight plan</p>
          <span class="heat info" id="heat" title="Motor heat: a longer flight makes my motors hotter"></span></div>
        <div class="plan" id="plan"></div>
        <div class="note" id="note"></div>
      </section>
      <section class="card solved" id="solvedPanel" hidden>
        <p class="solvedmsg" id="solvedMsg"></p>
        <div class="nextrow"><button class="btn-next go bignext" id="solvedNext">Next flight ▶</button>
        <button class="btn-replay" id="solvedReplay">↺ Replay</button></div>
      </section>
      <section class="card" id="p2Controls" hidden>
        <div class="controls">
          <div class="pad" id="pad">
            <button class="key tap L" data-d="L" aria-label="Turn left 90 degrees" title="Turn left 90° (←)"></button>
            <button class="key tap F" data-d="F" aria-label="Fly forward" title="Fly forward one square (↑)"></button>
            <button class="key tap R" data-d="R" aria-label="Turn right 90 degrees" title="Turn right 90° (→)"></button>
            <button class="key tap C" data-d="C" aria-label="Photo" title="Photo: a picture of the square in front (P)"></button>
          </div>
          <div class="actions">
            <button class="go" id="goBtn" title="Fly the plan (Enter)">GO ▶</button>
            <div>
              <button class="toolbtn" id="undoBtn" title="Erase a move: tap a move in your plan, then Undo (⌫). Nothing picked? It erases the last move."><i class="ico-eraser" aria-hidden="true"></i>Undo</button>
              <button class="toolbtn" id="clearBtn" title="Clear the whole plan">✕ Clear</button>
              <button class="toolbtn" id="hintBtn" title="Hint (H)">💡 Hint</button>
            </div>
          </div>
        </div>
      </section>
      <section class="card" id="p3Panel" hidden>
        <p class="label" id="p3Label"></p>
        <div id="p3Body"></div>
      </section>
    </div>
  </main>

  <footer>
    <canvas id="portrait" width="40" height="40" aria-hidden="true"></canvas>
    <div><div class="who" id="who"></div><div class="line" id="line" aria-live="polite"></div></div>
    <div class="cap-btns">
      <button class="toolbtn" id="backBtn" hidden title="Previous line (B)">◀ Back</button>
      <button class="next" id="nextBtn" data-cap-next hidden>Next ▶</button>
    </div>
  </footer>

  <div class="overlay" id="cardOverlay" hidden><div class="box mcard" id="cardBox"></div></div>

  <div class="overlay" id="startOverlay">
    <div class="box">
      <h2>Flight Plan</h2>
      <p>Ingenuity's story. Turn your sound on!</p>
      <p class="disc">An imaginary adventure starring real space explorers.<br>The missions and discoveries you uncover really happened.</p>
      <button class="go" id="startBtn" style="padding:0 36px">Start ▶</button>
      <p style="margin:16px 0 0; font-size:var(--fs-small)">or press <kbd>Enter</kbd></p>
    </div>
  </div>
</div>

<div class="dev" id="devPanel" hidden>
  <b>DEV</b>
  <select id="devJump" aria-label="Jump to step">
    <option value="briefing">Fresh start</option><option value="find">Find the flyer</option>
    <option value="meet">Meet Ingenuity</option><option value="before">Before you fly card</option>
    <option value="flight1">Flight 1</option><option value="flight2">Flight 2</option><option value="flight3">Flight 3</option><option value="flight4">Flight 4</option>
    <option value="check">Parts check</option><option value="story">Story time</option><option value="gift">Gift box</option>
    <option value="bench">Fit the panels</option>
    <option value="complete">Mission complete</option>
  </select>
  <button id="devGo">Go</button><button id="devReset">Reset save</button>
</div>

<script>
"use strict";
const A = __ASSETS__;
const PAL = __PAL__;
const T = 40;
let NW = 320, NH = 200;
const FAST = /[?&]fast=1\b/.test(location.search);          // fast / test mode: no orientation demo, quick gift box
const REDUCED = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
// Oppy's reward is a real Opportunity part (owner, 2026-11-15): the solar panels, shown by the gift box.
const REWARD = { key: "panels", name: "Solar panels", line: TEXT("ing.gift.020") };

// ---------- flight data (same as tools/verify_ingenuity_flights.py and the design doc, section 6) ----------
// Owner, 2026-11-14: each flight is a real KIND of flight Ingenuity flew. Legend: S home airfield (start),
// A new airfield, . sand, R rock, ~ featureless ripples, a striped rock (photo target).
// Moves: F fly forward, L / R turn 90°, C photo. h0 = the way it faces at the start (0 up, 1 right, 2 down, 3 left).
const FLIGHTS = [
  { id: "out-and-back", rows: ["S.a"], h0: 1, need: 1, land: "S", fewest: 5, hintRoute: ["F", "C", "L", "L", "F"],
    name: "Out and back", real: "Like Flight 4: fly out, take pictures, come home.",
    goal: "Take a photo of the striped rock, then land back <b>home</b>.",
    intro: LINE("ing.board.010"),
    step: "Photo the striped rock, then fly back home and land" },
  { id: "new-airfield", rows: ["S.R.", ".~aA"], h0: 1, need: 1, land: "A", fewest: 7, hintRoute: ["F", "F", "F", "R", "F", "R", "C"],
    name: "New airfield", real: "Like Flight 5: the first one-way trip to a new airfield.",
    goal: "Photo the striped rock, then land on the <b>new airfield</b>.",
    intro: LINE("ing.board.020"),
    step: "Photo the striped rock, then land on the new airfield" },

// The direction ring: a very faint circle on the ground around Ingenuity (owner, 2026-11-15: less clutter, no text).
// The small lime arrow on it is the front, where its colour camera looks. While it turns, a lavender arc sweeps round.
function drawRing(c, x, y, ang, r, opts = {}) {
  const P = (rad, a) => [x + Math.cos(a) * rad, y + Math.sin(a) * rad];
  const tri = (pts, col) => { c.fillStyle = col; c.beginPath(); c.moveTo(...pts[0]); c.lineTo(...pts[1]); c.lineTo(...pts[2]); c.closePath(); c.fill(); };

function drawAngleTag(g, lx, ly, deg, sn = snap) {         // the little white "90°" counter beside the ring (digits in the clear font)
  g.fillStyle = PAL.outline; g.fillRect(sn(lx - 15), sn(ly - 8), 30, 16);
  g.fillStyle = "#ffffff"; g.fillRect(sn(lx - 14), sn(ly - 7), 28, 14);

function drawPhotoBubble(g, x0, y0, w, h, label) {          // the picture that appears beside the rock
  g.fillStyle = PAL.outline; g.fillRect(x0 - 1, y0 - 1, w + 2, h + 2);
  g.fillStyle = "#f4efff"; g.fillRect(x0, y0, w, h);

function drawChevrons(g, x, y, dx, dy) {                    // chevrons on the ground show which way it is flying
  const ang = Math.atan2(dy, dx);
  g.save(); g.globalAlpha = 0.8;
  for (let i = 0; i < 3; i++) {
    const d = 22 + i * 7, px2 = x + dx * d, py2 = y + dy * d;
    fillPoly([[px2 + Math.cos(ang) * 4, py2 + Math.sin(ang) * 4], [px2 + Math.cos(ang + 2.3) * 5, py2 + Math.sin(ang + 2.3) * 5], [px2 + Math.cos(ang - 2.3) * 5, py2 + Math.sin(ang - 2.3) * 5]], i === 2 ? PAL.outline : PAL.neonLime, g);

function heliShadow(g, x, gy, alt, spin, sn = snap) {       // its shadow: down-right, fainter as it climbs
  g.save(); g.globalAlpha = Math.max(0.14, 0.32 - alt / 90);

function heliSpin(g, x, gy, alt, d8, now, sn = snap) {      // the flying view: a frame per 45 degrees, flipped for the left
  const k = ((d8 % 8) + 8) % 8, i = k <= 4 ? k : 8 - k, flip = k > 4 ? -1 : 1;
  const f = tag("ingenuityTurn", ["up", "upRight", "right", "downRight", "down"][i]).from + Math.floor(now / 60) % 4;
  g.save(); g.translate(x, sn(gy - alt)); g.scale(flip, 1);

function drawHeliRing() {
  if (S.phase !== "p2") return;
  const f = R.turnFx;
  if (f && f.end && performance.now() > f.end) R.turnFx = null;
  const turning = R.turnFx && !R.turnFx.end, ang = turning ? f.a0 + f.dir * f.sweep * f.k : ANG(R.h);
  const x = bx(), y = groundY() - 17;

  if (R.turnFx) {                                          // the angle counter
    const left = R.turnFx.end ? R.turnFx.end - performance.now() : 999, deg = Math.round(R.turnFx.k * 90) + "°";

function drawHeli(now) {                                   // Ingenuity on the board: its shadow on the ground, the sprite above it
  const x = bx(), gy = groundY(), alt = R.alt;

function drawWatcher(now) {                                // Curiosity beside the board, watching
  const x = SIDE / 2 - 2, y = NH - 14;
  cx.fillStyle = PAL.sandDark; cx.fillRect(x - 34, y - 2, 68, 6);

function fillPoly(pts, c, g = cx) {                        // pixel-crisp filled polygon
  g.fillStyle = c; const ys = pts.map(p => p[1]);
  for (let y = Math.floor(Math.min(...ys)); y < Math.ceil(Math.max(...ys)); y++) {
    const yc = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++) { const [ax, ay] = pts[i], [bx2, by2] = pts[(i + 1) % pts.length]; if ((ay <= yc && by2 > yc) || (by2 <= yc && ay > yc)) xs.push(ax + (yc - ay) * (bx2 - ax) / (by2 - ay)); }

}
function drawParts() {
  S.parts = S.parts.filter(p => p.life > 0);
