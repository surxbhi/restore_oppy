<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisper Beneath Mars</title>
<!-- Prototype. Built by tools/make_sprites.mjs from insight.template.html: edit the template. Same structure as phoenix.template.html. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Jersey+15&display=swap" rel="stylesheet">
<style>
  /* Whisper Beneath Mars on the scaled stage (owner, 2026-11-15): every size is a design pixel on the 1280 x 720 stage.
     The frame (header, step banner, main, caption bar), the buttons, tiles, cards and story chrome come from house.css. */
  :root {
    --night: #1b1433; --night2: #2e2357; --panel: #261c48; --ink: #f6f0ff; --muted: #b9acdf;
    --pink: #ff7ad9; --cyan: #7ff7ff; --lime: #b8ff7a; --yellow: #fff27a; --lav: #c6a8ff; --orange: #ffab6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font-family: "Jersey 15", system-ui, sans-serif; font-size: 20px;
    background:
      radial-gradient(2px 2px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(2px 2px at 78% 12%, #7ff7ffaa 50%, transparent 51%),
      radial-gradient(2px 2px at 44% 82%, #ff7ad9aa 50%, transparent 51%),
      radial-gradient(2px 2px at 90% 70%, #fff8 50%, transparent 51%),
      linear-gradient(180deg, #1b1433 0%, #2a1d52 60%, #3b2266 100%);
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: var(--ink); }
  button:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }

  /* ---------- the scene: 320 x 200 game pixels at 2x (640 x 400), with a small label under it ---------- */
  .board-stack { display: grid; gap: 6px; justify-items: center; }
  canvas#game { border-radius: 14px; box-shadow: 0 0 0 3px #7ff7ff55, 0 0 40px #ff7ad944; background: var(--night); touch-action: none; display: block; }
  .scenenote { margin: 0; height: 22px; font-family: var(--font-read); font-size: var(--fs-small); line-height: 22px; color: var(--muted); }
  .card { background: #261c48cc; border: 0; border-radius: 16px; padding: var(--card-pad); }
  .label { color: var(--muted); font-size: var(--fs-label); margin: 0 0 8px; }
  .label:empty { display: none; }

  /* ---------- controls: arrows on the left, Hint beside Up, a tall Put down on the right ---------- */
  .controls { display: grid; grid-template-columns: repeat(3, 76px) minmax(0, 1fr); grid-template-rows: 64px 64px; gap: 8px; }
  .key { padding: 0; min-width: 0; color: var(--cyan); background: #ffffff10; }
  .key svg { width: 38px; height: 38px; display: block; margin: auto; }
  .key.flash { transform: translateY(2px); box-shadow: 0 1px 0 var(--depth); filter: brightness(1.4); }
  .k-up { grid-column: 2; grid-row: 1; } .k-left { grid-column: 1; grid-row: 2; } .k-down { grid-column: 2; grid-row: 2; } .k-right { grid-column: 3; grid-row: 2; }
  .controls .k-hint { grid-column: 3; grid-row: 1; height: 100%; padding: 0 4px; --accent: var(--yellow); color: var(--yellow); }
  .controls .k-set { grid-column: 4; grid-row: 1 / span 2; height: auto; padding: 0 12px; }
  .go.flash { transform: translateY(3px); box-shadow: 0 2px 0 #2e8a49; }
  /* the scene's one main action (Hammer, Fit the antenna): house.css .main-action, beside the scene (the 22px note under it leaves no room below) */

  /* ---------- solved panel: a short positive line, the teaching sentence, one big Next, a small Replay ---------- */
  .solved { text-align: center; }
  .solvedmsg { margin: 0 0 12px; }
  .praise { margin: 0 0 8px; font-size: var(--fs-heading); font-family: var(--font-display); color: var(--lime); }
  .why { margin: 0 0 6px; font-size: var(--fs-body); font-family: var(--font-read); text-align: left; line-height: 1.35; }
  .solved .btn-next { height: var(--h-btn-primary); animation: nextGlow 1.3s ease-in-out infinite alternate; }
  @keyframes nextGlow { from { box-shadow: 0 5px 0 #2e8a49, 0 0 16px #b8ff7a77; } to { box-shadow: 0 5px 0 #2e8a49, 0 0 36px #b8ff7add; } }

  /* ---------- picture answers (survey, traces, learning check): every one is a tile you can tap ---------- */
  .answers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .answers.three { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .answer { position: relative; padding: 8px 8px 10px; background: #ffffff10; color: var(--ink); font-family: var(--font-read); font-size: var(--fs-label); line-height: 1.25;
    display: flex; flex-direction: column; align-items: center; gap: 6px; animation: ansIn .4s ease-out both; }
  .answer canvas { image-rendering: pixelated; display: block; border-radius: 8px; }
  .answers.waiting .answer:not(.crossed) { animation: ansIn .4s ease-out both, ansPulse 1.5s ease-in-out .5s infinite; }
  .answers .answer:nth-child(2) { animation-delay: .08s, .6s; } .answers .answer:nth-child(3) { animation-delay: .16s, .7s; }
  .answer.right { --accent: var(--lime); background: #b8ff7a33; }
  .answer.wrong { animation: shake .35s; }
  .answer.crossed { animation: shake .35s both; opacity: .5; --accent: var(--orange); box-shadow: none; cursor: not-allowed; }
  .answer.crossed canvas { filter: grayscale(.5); }
  @keyframes ansIn { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes ansPulse { 0%, 100% { box-shadow: 0 4px 0 var(--depth), 0 0 0 0 #7ff7ff00; } 50% { box-shadow: 0 4px 0 var(--depth), 0 0 18px 2px #7ff7ffaa; } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .qbig { margin: 0 0 14px; font-size: var(--fs-heading); line-height: 1.2; color: var(--yellow); text-shadow: 0 0 10px #fff27a55; font-weight: 700; }
  .qpop { animation: qpop .4s ease-out both; }
  @keyframes qpop { from { opacity: 0; transform: translateY(-10px) scale(.96); } to { opacity: 1; transform: none; } }
  .disc { font-size: var(--fs-small); color: var(--lav) !important; }
  @media (prefers-reduced-motion: reduce) { .solved .btn-next, .answer, .answers.waiting .answer { animation: none !important; } }

  /* ---------- story time: the whole main area, real NASA pictures and the marsquake video ---------- */
  .play.story { grid-template-columns: minmax(0, 1fr) !important; align-items: stretch !important; }
  .play.story .play-board, .play.story .play-ctrls { display: none; }
  #storyStage { height: 100%; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 4px; }
  #storyStage .st-media { background: #120d24; border-radius: 16px; padding: 10px; }
  #storyStage .st-fig { animation: st-in .45s ease-out both; }
  #storyStage .st-frame img, #storyStage .st-frame video { max-height: 340px; width: auto; height: auto; max-width: 100%; }
  #storyStage .st-frame video { background: #161026; }
  .st-frame .st-play { position: absolute; z-index: 3; background: #1b1433e6; color: var(--ink); font-family: var(--font-display); }
  .st-frame .st-play { left: 50%; top: 50%; width: 88px; height: 88px; margin: -44px 0 0 -44px; border-radius: 50%; font-size: 40px; padding: 0 0 0 6px; }
  @keyframes st-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #storyStage .st-fig { animation: none; } }

  /* ---------- caption bar (sizes in house.css) ---------- */
  #portrait { border-radius: 12px; background: #2e2357; }
  .who { color: var(--cyan); font-weight: 700; }
  .dev { display: flex; gap: 6px; align-items: center; background: #000c; border: 2px dashed var(--yellow); color: var(--yellow); font: 14px system-ui, sans-serif; }
  .dev select, .dev button { font: 14px system-ui, sans-serif; }
  .err { position: fixed; left: 0; right: 0; top: 0; background: #b00020; color: #fff; padding: 8px; z-index: 9; }

  /* ---------- cards ---------- */
  .closex { position: absolute; right: -14px; top: -14px; width: 52px; height: 52px; border-radius: 50%; cursor: pointer;
    border: 4px solid #fff3d6; background: radial-gradient(circle at 35% 30%, #ffb07a, #f2672e); color: #fff;
    font: 700 26px/1 system-ui, sans-serif; box-shadow: 0 0 0 3px #1b1433, 0 4px 0 #1b1433, 0 0 18px #ff8a5c88; }
  .closex:hover { filter: brightness(1.1); transform: translateY(-2px); }
  .closex:active { transform: translateY(2px); }
  .closex:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }
  .overlay { display: grid; place-items: center; background: #1b1433dd; z-index: 5; }
  .overlay .box { position: relative; text-align: center; background: var(--panel); border: 3px solid var(--cyan); border-radius: 24px; padding: 24px 36px; box-shadow: 0 0 40px #7ff7ff55; max-width: 680px; }
  .overlay h2 { font-size: var(--fs-heading); margin: 0 0 8px; color: var(--cyan); text-shadow: 0 0 12px #7ff7ff; }
  .overlay p { color: var(--ink); margin: 0 0 14px; }
  .mcard { text-align: left !important; }
  .mcard h2 { text-align: center; }
  .mcard .row { display: flex; justify-content: center; margin-top: 16px; }
  .badge { display: inline-block; font-size: var(--fs-small); padding: 2px 10px; border-radius: 999px; background: #ff7ad933; color: var(--pink); }
</style>

<body>
<div id="app" data-stage class="frame">
  <header class="hdr">
    <h1 class="hdr-title">Whisper Beneath Mars</h1>
    <div class="hdr-ctrls">
      <button class="hbtn hbtn-mission" id="missionBtn" title="See your mission">Your mission</button>
      <button class="hbtn" id="voiceBtn" aria-pressed="true" title="Voice on or off (V)">🔊 Voice</button>
      <button class="hbtn" id="restartBtn" hidden title="Start InSight's story again">↺ Restart</button>
    </div>
  </header>
  <div class="stepbar" id="stepbar" aria-live="polite"><span class="step-text" id="stepText"></span><span class="step-sub" id="stepSub"></span></div>

  <main class="play" id="play">
    <div class="play-board">
      <div class="board-stack"><canvas id="game" width="640" height="400" aria-label="Game picture"></canvas><p class="scenenote" id="sceneNote"></p></div>
      <button class="main-action beside" id="hammerBtn" hidden title="Hammer (Space)">&#128296; Hammer · <span class="digits" id="hammerSub">0 / 3</span></button>
      <button class="main-action beside" id="fitBtn" hidden title="Fit the antenna (Space)">Fit the antenna</button>
    </div>
    <section id="storyStage" hidden aria-label="Story time">
      <div class="st-top"><span class="st-title" id="stTitle"></span><span class="st-part" id="stPart"></span><span class="st-dots" id="stDots"></span></div>
      <div class="st-media" id="stMedia"></div>
    </section>

    <div class="play-ctrls">
      <section class="card" id="armControls" hidden>
        <div class="controls">
          <button class="key tap k-up" data-m="up" aria-label="Move the arm up" title="Move up (↑)"></button>
          <button class="key tap k-left" data-m="left" aria-label="Move the arm left" title="Move left (←)"></button>
          <button class="key tap k-down" data-m="down" aria-label="Move the arm down" title="Move down (↓)"></button>
          <button class="key tap k-right" data-m="right" aria-label="Move the arm right" title="Move right (→)"></button>
          <button class="toolbtn k-hint" id="armHintBtn" title="Hint (H)">💡 Hint</button>
          <button class="go k-set" id="setDownBtn" title="Put down (Space)">Put down</button>
        </div>
      </section>

      <section class="card" id="p3Panel" hidden>
        <p class="label" id="p3Label"></p>
        <div id="p3Body"></div>
      </section>

      <section class="card solved" id="solvedPanel" hidden>
        <div class="solvedmsg" id="solvedMsg"></div>
        <div class="nextrow"><button class="btn-next go bignext" id="solvedNext">Next ▶</button>
        <button class="btn-replay" id="solvedReplay">↺ Replay</button></div>
      </section>
    </div>
  </main>

  <footer>
    <canvas id="portrait" width="40" height="40" aria-hidden="true"></canvas>
    <div><div class="who" id="who"></div><div class="line" id="line" role="status" aria-live="polite"></div></div>
    <div class="cap-btns">
      <button class="toolbtn" id="backBtn" hidden title="Previous line (B)">◀ Back</button>
      <button class="next" id="nextBtn" data-cap-next hidden>Next ▶</button>
    </div>
  </footer>

  <div class="overlay" id="cardOverlay" hidden><div class="box mcard" id="cardBox"></div></div>

  <div class="overlay" id="startOverlay">
    <div class="box">
      <h2>Whisper Beneath Mars</h2>
      <p>InSight's story. Turn your sound on!</p>
      <p class="disc">An imaginary adventure starring real space explorers.<br>The missions and discoveries you uncover really happened.</p>
      <button class="go" id="startBtn">Start ▶</button>
      <p style="margin:16px 0 0; font-size:var(--fs-small); color:var(--muted)">or press <kbd>Enter</kbd></p>
    </div>
  </div>
</div>

<div class="dev" id="devPanel" hidden>
  <b>DEV</b>
  <select id="devJump" aria-label="Jump to step">
    <option value="start">Fresh start</option><option value="opening">Find InSight</option><option value="cards">Mission cards</option>
    <option value="patch">Survey the site</option><option value="sensor">Put SEIS down</option><option value="shield">Cover it with the shield</option>
    <option value="heat">Try the heat probe</option><option value="wave">Listen: waves</option><option value="learning">What was SEIS listening for?</option>
    <option value="story">Story time</option><option value="gift">Gift box</option><option value="install">Fit the antenna on Oppy</option>
    <option value="complete">Mission complete</option>
  </select>
  <button id="devGo">Go</button><button id="devReset">Reset save</button>
</div>


<script src="audio/manifest.js"></script>

<script>
"use strict";
__PUZZLES__
const A = __ASSETS__;
const PAL = __PAL__;
const QS = new URLSearchParams(location.search), DEV = QS.has("dev") && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname); // dev tools only on the developer's own computer, never for players (owner, 2026-11-15: "remove the dev mode")
const FAST = QS.get("fast") === "1";                                   // fast / test mode: no demos, animations finish at once
const REDUCED = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const SAVE_KEY = "ins.progress";

// ---------- self-check: both wave matches must have exactly one right answer ----------
(() => {
  try { verify(); }
  catch (e) { document.body.insertAdjacentHTML("afterbegin", `<div class="err">Wave check failed: ${e.message}</div>`); }
})();

// ---------- the mission: six steps ----------
const STEPS = [
  { id: "patch", short: "Survey", name: "Survey the site", goal: "Which surface should we choose?", desc: "Pick the flat patch." },
  { id: "sensor", short: "Put SEIS down", name: "Put SEIS down", goal: "Can you guide SEIS onto the flat patch?", desc: "Put SEIS down on the ground." },
  { id: "shield", short: "Shield", name: "Cover it with the shield", goal: "Can you cover SEIS?", desc: "Place the shield over SEIS." },
  { id: "heat", short: "Heat probe", name: "Try the heat probe", goal: "Can the mole reach deep enough?", desc: "Fire 3 hammer strikes." },
  { id: "wave", short: "Listen", name: "Listen", goal: "Which trace matches this vibration?", desc: "Match two vibration traces." },
  { id: "check", short: "Check", name: "Learning check", goal: "What was SEIS listening for?", desc: "A quiz, then look inside Mars." },
];
const stepIndex = id => STEPS.findIndex(s => s.id === id);

// ---------- images ----------
const img = {};
const load = k => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = A[k].src; img[k] = i; });
const fr = (sheet, name) => Math.max(0, A[sheet].names.indexOf(name));
const tag = (sheet, name) => A[sheet].tags.find(t => t.name === name);
function sprite(sheet, f, x, y, s = 1, flip = false) {
  const w = A[sheet].fw, h = A[sheet].fh;
  cx.save(); cx.translate(snap(x), snap(y)); if (flip) { cx.scale(-s, s); cx.drawImage(img[sheet], f * w, 0, w, h, -w, 0, w, h); }
  else { cx.scale(s, s); cx.drawImage(img[sheet], f * w, 0, w, h, 0, 0, w, h); }
  cx.restore();
}

// ---------- canvas ----------
const cv = document.getElementById("game");
let cx = cv.getContext("2d");             // let: offscreen() draws the same pictures onto a small canvas
let NW = 320, NH = 200, SCALE = 2, PX = 2;
function fit() {
  // The board cell is a fixed 672 x 472 design px on the 1280 x 720 stage, so the scene (320 x 200 game px) is always 2x:
  // the largest WHOLE number that fits. The canvas holds real screen pixels (design size x stage scale x devicePixelRatio).
  const cell = document.querySelector(".play-board");
  const room = Math.min((cell.clientWidth || 672) / NW, ((cell.clientHeight || 472) - 30) / NH);
  SCALE = Math.max(1, Math.floor(room));
  const dev = (window.stage?.scale || 1) * (window.devicePixelRatio || 1);
  cv.width = Math.round(NW * SCALE * dev); cv.height = Math.round(NH * SCALE * dev);
  cv.style.width = NW * SCALE + "px"; cv.style.height = NH * SCALE + "px";
  PX = SCALE * dev; cx.imageSmoothingEnabled = false;
}
const snap = v => Math.round(v * PX) / PX;
addEventListener("stage:fit", fit);                                    // the stage changed scale: more or fewer real pixels to draw
if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(document.querySelector(".play-board"));   // story time hides the board cell
const sceneNote = t => { document.getElementById("sceneNote").textContent = t || ""; };

// ---------- state and save ----------
const S = {
  phase: "start", step: -1, busy: false, fast: FAST, parts: [], draw: null, scene: null, patch: null, dep: null, heat: null, wave: null, check: null, install: null,
  progress: loadProgress(),
};
function loadProgress() {
  let v = null; try { v = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch {}
  v = v || {};
  const steps = v.steps || {};
  if (v.done) for (const s of STEPS) steps[s.id] = steps[s.id] || { done: true };   // an older save that only says "done"
  return { intro: !!(v.intro || v.done), steps, story: !!(v.story || v.done), installed: !!(v.installed || v.done), done: !!v.done };
}
function saveProgress() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S.progress)); } catch {} }

// ---------- voice + captions ----------
// Every spoken line is in script/insight.script.js: LINE(id) gives { id, who, text }. voice.js speaks it: the recording in
// audio/ if there is one, else the computer voice (contract: .claude/script-contract.md).
let nextResolve = null, speaker = "curiosity", lastLine = null;
function say(line, { next = false, back = false, quiet = false } = {}) {   // line = LINE(id), or a step of several (Voice.step, packLines)
  speaker = line.who; lastLine = line;
  document.getElementById("who").textContent = Voice.name(line.who);
  const lineEl = document.getElementById("line"); lineEl.textContent = line.text;
  if (quiet) Voice.stop();                       // a page with its own sound (the marsquake video): show the words, do not speak over it
  else Voice.speak(line);
  const nb = document.getElementById("nextBtn"), bb = document.getElementById("backBtn");
  if (nextResolve && !next) { const r = nextResolve; nextResolve = null; r("skip"); }
  if (!next) { nb.hidden = true; bb.hidden = true; return Promise.resolve("next"); }
  nb.hidden = false; bb.hidden = !back; nb.focus({ preventScroll: true });
  return new Promise(res => { nextResolve = (v = "next") => { nb.hidden = true; bb.hidden = true; nextResolve = null; res(v); }; });
}
// Fewer clicks: split lines into sentences and pack neighbours by the same speaker into steps of about two caption lines
// (a character budget; a sentence is never cut). Everything queued through lines() is packed, so edited text repacks itself.
// Voice.step keeps which line each sentence came from (a whole line plays its recording; a part of a line, the computer voice).
const STEP_CHARS = 185;
const splitSentences = text => text.match(/[^.!?]+[.!?]+["')\u201d]*|[^.!?]+$/g) || [text];
function packLines(list) {                       // [LINE(...), ...] -> fewer steps (Voice.step), same speaker per step
  const out = [];
  for (let i = 0; i < list.length;) {
    let j = i; const pieces = [];
    while (j < list.length && list[j].who === list[i].who) {
      for (const t of splitSentences(list[j].text).map(t => t.trim()).filter(Boolean)) pieces.push({ line: list[j], text: t });
      j++;
    }
    const steps = [];
    for (const p of pieces) {
      const last = steps[steps.length - 1];
      if (last && (last.text + " " + p.text).length <= STEP_CHARS) { last.text += " " + p.text; last.pieces.push(p); }
      else steps.push({ text: p.text, pieces: [p] });
    }
    steps.forEach(st => out.push(Voice.step(st.pieces)));
    i = j;
  }
  return out;
}
async function lines(list) {                     // a little conversation; Back goes to the previous line
  list = packLines(list);
  for (let i = 0; i < list.length;) {
    const r = await say(list[i], { next: true, back: i > 0 });
    i = r === "back" ? Math.max(0, i - 1) : i + 1;
  }
}
document.getElementById("nextBtn").onclick = () => nextResolve && nextResolve("next");
document.getElementById("backBtn").onclick = () => nextResolve && nextResolve("back");
const voiceBtn = document.getElementById("voiceBtn");
Voice.button(voiceBtn);                          // 🔊 / 🔇 Voice: on and off for the recordings and the computer voice (?mute=1 starts off)

const pv = document.getElementById("portrait"), pxc = pv.getContext("2d"); pxc.imageSmoothingEnabled = false;
function drawPortrait(now) {
  const talking = Voice.talking(now);
  pxc.clearRect(0, 0, 40, 40);
  if (speaker === "oppy") {
    const t = tag("oppy", talking ? "talk" : "idle"), f = t.from + (talking ? Math.floor(now / 140) % 2 : 0);
    pxc.drawImage(img.oppy, f * 64 + 31, 0, 28, 13, 1, 10, 38, 18); return;
  }
  if (speaker === "seis") {                      // SEIS: a little dome with eyes, drawn in pixel rows
    const row = (cxm, y, hw, col) => { pxc.fillStyle = col; pxc.fillRect(cxm - hw, y, hw * 2, 1); };
    const dome = (r, base, col) => { for (let dy = 0; dy < r; dy++) row(20, base - 1 - dy, Math.round(Math.sqrt(r * r - (dy + 0.5) ** 2)), col); };
    dome(19, 31, PAL.outline); dome(18, 31, PAL.metal); dome(11, 26, PAL.metalHi);

  const t = tag("curiosityAngled", anim), f = t.from + (anim === "idle" ? (now % 2600 > 2450 ? 1 : 0) : Math.floor(now / 160) % 2);

});
function flash(sel) { const b = document.querySelector(sel); if (!b) return; b.classList.add("flash"); setTimeout(() => b.classList.remove("flash"), 120); }
document.querySelectorAll(".key[data-m]").forEach(b => b.onclick = () => nudgeTip(b.dataset.m));
document.getElementById("setDownBtn").onclick = setDown;
document.getElementById("armHintBtn").onclick = armHint;
document.getElementById("hammerBtn").onclick = strike;
document.getElementById("restartBtn").onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch {} location.reload(); };

// =====================================================================================
// Start, dev menu, test hook
// =====================================================================================
document.getElementById("devPanel").hidden = !DEV;
if (QS.get("jump")) document.getElementById("devJump").value = QS.get("jump");
document.getElementById("devGo").onclick = () => { location.search = "?dev=1&jump=" + document.getElementById("devJump").value; };
document.getElementById("devReset").onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch {} location.search = "?dev=1"; };
function devProgress(n) {                          // pretend the first n steps are done, each marked done
  const P = S.progress; P.intro = true; P.steps = {}; P.story = false; P.installed = false; P.done = false;
  STEPS.slice(0, n).forEach(s => { P.steps[s.id] = { done: true }; });
  renderMission();
}
const cardsIntro = async () => { say(LINE("ins.cards.010")); await showMissions("MISSION: INSIGHT", "Let's go ▶"); };
const JUMP = {
  start: async () => { try { localStorage.removeItem(SAVE_KEY); } catch {} S.progress = loadProgress(); await begin(true); },   // a fresh start
  opening: async () => { devProgress(0); S.progress.intro = false; await openingScene(); await cardsIntro(); runFrom(0); },
  cards: async () => { devProgress(0); S.phase = "scene"; S.step = -1; setCanvas(320, 200); S.draw = drawOpening; await cardsIntro(); runFrom(0); },
  patch: () => { devProgress(0); runFrom(0); },
  sensor: () => { devProgress(1); runFrom(1); },
  shield: () => { devProgress(2); runFrom(2); },
  heat: () => { devProgress(3); runFrom(3); },
  wave: () => { devProgress(4); runFrom(4); },
  learning: () => { devProgress(5); runFrom(5); },
  story: () => { devProgress(6); afterSteps(); },
  gift: () => { devProgress(6); S.progress.story = true; afterSteps(); },
  reward: () => JUMP.gift(),
  install: async () => { devProgress(6); S.progress.story = true; await installSensor(); missionComplete(); },
  complete: () => { devProgress(6); Object.assign(S.progress, { story: true, installed: true }); missionComplete(); },
};
async function begin(force = false) {
  if (S.phase !== "start" && !force) return;
  document.getElementById("startOverlay").hidden = true;
  S.phase = "boot"; renderMission();
  // No Oppy briefing here: the game shell introduces Oppy once, at the start.
  if (!S.progress.intro) { await openingScene(); await cardsIntro(); return runFrom(0); }
  const i = STEPS.findIndex((s, k) => k < 5 && !S.progress.steps[s.id]?.done);
  if (i >= 0) return runFrom(i);
  if (!S.progress.steps.check?.done) return runFrom(5);
  if (!S.progress.done) return afterSteps();
  runFrom(0);
}
document.getElementById("startBtn").onclick = () => begin();
Promise.all(Object.keys(A).map(load)).then(() => {
  fit(); renderMission(); requestAnimationFrame(render);
  const jump = QS.get("jump");
  if (DEV && jump && JUMP[jump]) { document.getElementById("startOverlay").hidden = true; S.phase = "boot"; JUMP[jump](); }
  window.__ins = {
    S, STEPS, waves, jumps: JUMP, runFrom, afterSteps, stepPatch, pickPatch, nudgeTip, moveTip, setDown, strike, storyTime, giftScene, installSensor, fitSensor, missionComplete, openMissions, showMissions, begin,
    get phase() { return S.phase; }, get step() { return S.step; },
    get done() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { return null; } },
  };
});
</script>
