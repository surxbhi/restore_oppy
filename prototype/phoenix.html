  .answers .answer:nth-child(2) { animation-delay: .08s, .6s; } .answers .answer:nth-child(3) { animation-delay: .16s, .6s; } .answers .answer:nth-child(4) { animation-delay: .24s, .6s; }

<div id="app" data-stage class="frame">
  <header class="hdr">
    <h1 class="hdr-title">The Clue That Vanished</h1>

      <button class="hbtn hbtn-mission" id="missionBtn" title="See your mission">Your mission</button>

function stFigure(m) {

  const watch = m.watch ? ` <a class="st-watch" href="${m.watch[0]}" target="_blank" rel="noopener">${m.watch[1]}</a>` : "";
  const cap = `<figcaption class="st-credit">${m.caption}${m.credit ? ` · <a href="${m.source}" target="_blank" rel="noopener">${m.credit}</a>` : ""}${watch}</figcaption>`;
  if (m.type === "video" && m.src) return `<figure class="st-fig"><div class="st-frame st-video">${tag}
      <video src="${m.src}" poster="${m.poster || ""}" autoplay loop muted playsinline preload="metadata" aria-label="${m.alt}"></video></div>${cap}</figure>`;
  const marks = (m.marks || []).map(([x, y, r = 12]) => `<i class="st-mark" style="left:${x}%;top:${y}%;--r:${r}%"></i>`).join("");
  if (m.type === "flip") return `<figure class="st-fig"><div class="st-frame st-flip">${tag}
      <span class="st-label la">${m.a.label}</span><span class="st-label lb">${m.b.label}</span>
      <img src="${m.a.src}" alt="${m.alt}" loading="eager"><img class="fb" src="${m.b.src}" alt="" loading="eager">${marks}</div>${cap}</figure>`;
  return `<figure class="st-fig"><div class="st-frame">${tag}${label}
      <img src="${m.src}" alt="${m.alt}" loading="eager">${marks}</div>${cap}</figure>`;
}

}
function earnedLayers() {                          // layers Oppy already wears, from the shell's save

  const got = (hub && hub.parts) || {}, out = [];

const MISSION = ["Find Phoenix", "Solve the cases", "Find out the story"];      // owner, 2026-11-14

function casePic(i) { return PICS["c" + i] || (PICS["c" + i] = offscreen(PW, PHT, () => drawPicture(0, 0, CASES[i], "earlier"))); }
function missionsHTML(title, complete = false) {  // Track Detective's mission panel, filled with Phoenix's steps
  const pr = S.progress, cases = CASES.filter(c => pr.cases[c.id]?.done).length, all = cases === CASES.length;

  ];

  const rewardChip = (r, shown) => r !== "mystery" ? `<span class="reward">REWARD: ${r}</span>`
    : shown ? `<span class="reward">REWARD: ${PART.name}</span>` : `<span class="reward mystery"><i class="giftico" aria-hidden="true"></i>A mystery part for Oppy</span>`;
  let open = true;

    if (!open) m.pct = 0;
    if (!done) open = false;
    return `<div class="mc ${state}"><span class="num">${i + 1}</span>${done ? '<span class="tick">✓</span>' : ""}
      <div class="bar"><i style="width:${m.pct}%"></i></div>
      <img src="${stepPic(i)}" alt="">${state === "locked" ? '<span class="lock">🔒</span>' : ""}
      <div class="mname">${MISSION[i]}</div><div class="mdesc">${m.desc}</div>
      ${rewardChip(m.reward, revealed)}</div>`;
  }).join("");
  if (complete) {
    return `<div class="mtitle">${title}</div>
    <p class="msub">You solved the case of the vanishing ice! Oppy has an arm again.</p>

    <div class="mstars">${CASES.map((c, i) => `<figure class="gold"><img src="${casePic(i)}" alt=""><span class="st">✓</span>${i + 1}. ${c.name}</figure>`).join("")}</div>
    <div class="mwhy">🔎 <b>All 4 cases solved.</b> Super detective!</div>`;
  }
  return `<div class="mtitle">${title}</div>
    <p class="msub">Phoenix's arm dug on Mars in 2008. It can help Oppy.</p>
    <div class="mgrid">${cards}</div>

}
const showMissions = (title, button) => showCard(missionsHTML(title), button, null, "mpanel");
function caseRows(status) {
  return `<div class="clist withpic">${CASES.map((c, i) => `<div><img src="${casePic(i)}" alt=""><span>${i + 1}. ${c.name}</span>${diffDots(c.diff)}<span>${status(c)}</span></div>`).join("")}</div>`;

function missionNow() { return ({ scene: 0, brief: 0, dig: 1, digIntro: 1, dug: 1, wait: 1, find: 1, solved: 1, p3: 2, story: 2, install: 2, complete: 2 })[S.phase] ?? -1; }
function renderMission() { renderStep(); }          // the progress lives in the Your mission panel now (the header step chips are gone)
// [Your mission] opens the mission panel (not on the start screen, nor while a card is already open).

// [?] reopens "Before you dig"; the caption line (and its Next button) that was showing comes back afterwards.

document.getElementById("helpBtn").addEventListener("click", openHelp);

// =====================================================================================
// Render loop
// =====================================================================================
function render(now) {
  cx.setTransform(PX, 0, 0, PX, 0, 0); cx.imageSmoothingEnabled = false;
  cx.clearRect(0, 0, NW, NH);
  if (["dig", "digIntro", "dug", "wait"].includes(S.phase) && S.dig) drawDig(now);
  else if (["find", "solved"].includes(S.phase) && S.find) drawFind(now);
  else if (S.phase === "story") { /* full-screen photos; nothing to draw */ }
  else if (S.phase === "install") drawInstall(now);
  else if (S.phase === "p3" || S.phase === "complete") { cx.fillStyle = PAL.night; cx.fillRect(0, 0, NW, NH); drawPicture(4, 18, CASES[0], "earlier"); drawPicture(172, 18, CASES[0], "later");
    for (const [x, l, col] of [[4, "EARLIER · SOL 20", PAL.neonCyan], [172, "LATER · SOL 24", PAL.neonPink]]) { cx.fillStyle = col; cx.fillRect(x, 5, 84, 11); txt(l, x + 42, 13.5, PAL.night, 8); }
    if (S.phase === "complete") { if (Math.random() < 0.08) sparkle(20 + Math.random() * (NW - 40), 20 + Math.random() * 80, 14); stepParts(0, 0); } }
  else drawScene(now);
  drawPortrait(now);
  requestAnimationFrame(render);
}

// =====================================================================================
// Keys
// =====================================================================================
addEventListener("keydown", e => {
  const ov = !document.getElementById("cardOverlay").hidden;
  if (ov) { if (e.key === "Escape" || e.key === "Enter") { e.preventDefault(); cardResolve && cardResolve(); } return; }
  if (S.phase === "start") { if (e.key === "Enter") { e.preventDefault(); begin(); } return; }
  if (e.key === "v" || e.key === "V") return voiceBtn.click();
  if (nextResolve && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return nextResolve("next"); }
  if (nextResolve && (e.key === "b" || e.key === "B") && !document.getElementById("backBtn").hidden) return nextResolve("back");
  if (solvedResolve && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return solvedResolve(); }
  if (S.phase === "dig") {
    const m = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
    if (m) { e.preventDefault(); flash(`.k-${m}`); return moveScoop(m); }
    if (e.key === " ") { e.preventDefault(); flash("#digBtn"); return digAction(); }
    if (e.key === "r" || e.key === "R") return turnScoop();
    if (e.key === "h" || e.key === "H") return digHint();
  }
  if (S.phase === "find") {
    if (e.key === " ") { e.preventDefault(); return blink(); }
    if (e.key === "h" || e.key === "H") return findHint();
  }
  if (S.phase === "install" && e.key === " ") { e.preventDefault(); return fitArm(); }
});
function flash(sel) { const b = document.querySelector(sel); if (!b) return; b.classList.add("flash"); setTimeout(() => b.classList.remove("flash"), 120); }
document.querySelectorAll(".key[data-m]").forEach(b => b.onclick = () => moveScoop(b.dataset.m));
document.getElementById("digBtn").onclick = digAction;
document.querySelectorAll(".tooltab").forEach(b => b.onclick = () => turnScoop(b.dataset.tool));
document.getElementById("digHintBtn").onclick = digHint;
document.getElementById("blinkBtn").onclick = blink;
document.getElementById("findHintBtn").onclick = findHint;
document.getElementById("restartBtn").onclick = () => { try { localStorage.removeItem("phx.progress"); } catch {} location.reload(); };

const QS = new URLSearchParams(location.search), DEV = QS.has("dev") && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname); // dev tools only on the developer's own computer, never for players (owner, 2026-11-15: "remove the dev mode")
document.getElementById("devPanel").hidden = !DEV;
document.getElementById("devGo").onclick = () => { location.search = "?dev=1&jump=" + document.getElementById("devJump").value; };
document.getElementById("devReset").onclick = () => { try { localStorage.removeItem("phx.progress"); } catch {} location.search = "?dev=1"; };
function devCases(n) { S.progress.intro = true; S.progress.cases = {}; for (let i = 0; i < n; i++) S.progress.cases[CASES[i].id] = { done: true, taps: vanishedCount(CASES[i]) }; renderMission(); }
const JUMP = {
  briefing: async () => { try { localStorage.removeItem("phx.progress"); } catch {} S.progress = loadProgress(); await begin(true); },   // a fresh start
  opening: async () => { devCases(0); S.progress.intro = false; await openingScene(); await beforeYouDig(); await casesOverview(); startCase(0); },
  before: async () => { devCases(0); await beforeYouDig(); await casesOverview(); startCase(0); },
  case1: () => { devCases(0); startCase(0); }, case2: () => { devCases(1); startCase(1); },
  case3: () => { devCases(2); startCase(2); }, case4: () => { devCases(3); startCase(3); },
  find1: () => { devCases(0); startFind(0); }, find2: () => { devCases(1); startFind(1); },
  find3: () => { devCases(2); startFind(2); }, find4: () => { devCases(3); startFind(3); },
  why: () => { devCases(4); afterCases(); },
  check: () => { devCases(4); S.progress.why = true; afterCases(); },
  story: () => { devCases(4); Object.assign(S.progress, { why: true, check: true, story: false }); afterCases(); },
  gift: () => { devCases(4); Object.assign(S.progress, { why: true, check: true, story: true, installed: false }); afterCases(); },
  install: async () => { devCases(4); Object.assign(S.progress, { why: true, check: true, story: true }); await installArm(); missionComplete(); },
  complete: () => { devCases(4); Object.assign(S.progress, { why: true, check: true, story: true, installed: true }); missionComplete(); },
};
async function begin(force = false) {
  if (S.phase !== "start" && !force) return;
  document.getElementById("startOverlay").hidden = true;
  S.phase = "boot"; renderMission();

  if (!S.progress.intro) { await openingScene(); await beforeYouDig(); await casesOverview(); return startCase(0); }
  const i = CASES.findIndex(c => !S.progress.cases[c.id]?.done);

});
