<!-- Prototype. Generated by tools/make_perseverance_sprites.mjs from secret-in-the-stripes.template.html: edit the template. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Jersey+15&display=swap" rel="stylesheet">
<style>
  /* Secret in the Stripes on the scaled stage (owner, 2026-11-15): every size is a design pixel on the 1280 x 720 stage.
     The frame (header, step banner, main, caption bar), buttons, tiles, cards, facts and story chrome come from house.css;
     the game's fonts are the shared tokens (--font-display, --font-read). Own rules that fight a house rule use #app. */
  :root {
    --night: #1b1433; --night2: #2e2357; --panel: #261c48; --ink: #f6f0ff; --muted: #b9acdf;
    --pink: #ff7ad9; --cyan: #7ff7ff; --lime: #b8ff7a; --yellow: #fff27a; --lav: #c6a8ff; --orange: #ffab6b;
    --gore: #ff8a3d; --goreShade: #d9622b; --cloth: #f4f7ff; --clothShade: #c9d0e6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font-size: 20px;
    background:
      radial-gradient(2px 2px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(2px 2px at 78% 12%, #7ff7ffaa 50%, transparent 51%),
      radial-gradient(2px 2px at 44% 82%, #ff7ad9aa 50%, transparent 51%),
      radial-gradient(2px 2px at 90% 70%, #fff8 50%, transparent 51%),
      linear-gradient(180deg, #1b1433 0%, #2a1d52 60%, #3b2266 100%);
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: var(--ink); }
  button:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }
  @keyframes pop { 30% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* ---------- the board: the 320 x 200 scene at 2x (640 x 400) ---------- */
  canvas#game { width: 640px; height: 400px; border-radius: 14px; box-shadow: 0 0 0 3px #7ff7ff55, 0 0 40px #ff7ad944; background: var(--night); }
  #app .play-ctrls > .card { padding: 10px 14px; }
  .lbl { margin: 0; }

  /* ---------- the puzzle: a clue, then the words. Stripe cells are buttons; everything else is information ---------- */
  .clue { margin: 0 0 8px; padding: 5px 12px; border-radius: 12px; background: #fff27a1a; font-family: var(--font-read); font-size: var(--fs-body); font-weight: 700; line-height: 1.25; color: var(--ink); }
  .clue span { color: var(--yellow); }
  .words { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; --sw: 28px; --sh: 54px; --ltf: 26px; --mw: 5px; --mh: 22px; }   /* stripe cell, letter size, small (sewn) stripe */
  .words.rows3 { --sw: 22px; --sh: 28px; --ltf: 20px; --mw: 4px; --mh: 12px; }
  .word { display: flex; flex-wrap: nowrap; justify-content: center; align-items: flex-end; gap: calc(6px * var(--k, 1)); white-space: nowrap; width: 100%; }
  .item { flex: none; display: grid; justify-items: center; gap: 2px; padding: 4px 5px; border-radius: 12px; }
  .item .st { display: flex; gap: calc(2px * var(--k, 1)); }
  .item.sewn .st i { width: calc(var(--mw) * var(--k, 1)); height: calc(var(--mh) * var(--k, 1)); border-radius: 2px; background: var(--cloth); }
  .item.sewn .st i.on { background: var(--gore); }
  .item .lrow { display: flex; align-items: center; gap: 6px; }
  #app .item .lt { font-family: var(--font-read); font-size: calc(var(--ltf) * var(--k, 1)); font-weight: 700; line-height: 1.1; color: var(--ink); }
  .item.miss .lt { color: var(--yellow); background: #00000033; border-radius: 8px; padding: 0 10px; }       /* an empty slot: flat */
  .item .rd { font-family: var(--font-read); font-size: var(--fs-small); font-weight: 700; color: var(--muted); }
  .item.miss.sel { background: #ffffff10; }
  .item.reading { background: #fff27a38; outline: 3px solid var(--yellow); outline-offset: -1px; }              /* the group the camera is reading now */
  .item.reading .lt { color: var(--yellow); }
  .item.bad .lt { background: #ffab6b40; color: var(--orange); animation: shake .35s; }
  .item.bad .rd { color: var(--orange); }
  .item.good .lt { color: var(--lime); }
  .item.good .rd { color: var(--lime); }
  #app .stripe { width: calc(var(--sw) * var(--k, 1)); height: calc(var(--sh) * var(--k, 1)); padding: 0; border-radius: 6px 6px 3px 3px; background: var(--cloth); --accent: #2fb4d8; }
  #app .stripe.on { background: var(--gore); --accent: var(--goreShade); }
  #app .stripe:disabled { cursor: not-allowed; }
  #app .words.locked .stripe { pointer-events: none; box-shadow: none; border-color: transparent; opacity: 1; }   /* solved: the finished stripes are a picture, not buttons */
  #app .stripe.nudge { animation: wig .45s ease-in-out infinite alternate; outline: 3px solid var(--yellow); }
  @keyframes wig { from { transform: rotate(-6deg); } to { transform: rotate(6deg) translateY(-3px); } }

  /* the stripe key (information): every letter's pattern; the readout takes the label's place while OPEN reads across */
  .keyhead { height: 34px; display: flex; align-items: center; margin: 0 0 6px; }
  .readout { display: flex; align-items: center; gap: 10px; font-family: var(--font-read); font-size: var(--fs-label); color: var(--muted); }
  .readout .st { display: flex; gap: 3px; } .readout .st i { width: 10px; height: 24px; border-radius: 3px; background: var(--cloth); } .readout .st i.on { background: var(--gore); }
  .readout b { font-family: var(--font-read); font-size: var(--fs-heading); line-height: 1; color: var(--yellow); }
  .skey { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .skey .kc { display: grid; grid-template-columns: auto 1fr; align-items: center; justify-items: center; gap: 6px; padding: 3px 6px; border-radius: 10px; background: #ffffff10; font-family: var(--font-read); font-size: 22px; font-weight: 700; line-height: 1; }
  .skey .kc b { display: flex; gap: 2px; order: 2; }
  .skey .kc i { width: 6px; height: 24px; border-radius: 2px; background: var(--cloth); }
  .skey .kc i.on { background: var(--gore); }
  .skey .kc.hl { background: var(--yellow); color: var(--night); box-shadow: 0 0 12px #fff27a99; }

  /* controls: Undo, Clear, Hint, and a tall OPEN */
  .controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 150px; grid-template-rows: var(--h-btn-primary); gap: 8px; margin-top: 10px; align-items: center; }
  .controls .toolbtn { height: var(--h-btn-tool); min-height: 0; padding: 0 4px; }
  .controls .go { height: var(--h-btn-primary); min-height: 0; padding: 0 8px; }
  .go.nudge { animation: pop .8s infinite; }
  .point { animation: pointMe .6s ease-in-out infinite alternate; }
  @keyframes pointMe { from { outline: 3px solid #fff27a00; outline-offset: 2px; } to { outline: 4px solid var(--yellow); outline-offset: 5px; } }

  /* ---------- solved panel ---------- */
  .solved { text-align: center; }
  #app .solved .solvedword { display: block; white-space: nowrap; font-family: var(--font-read); font-weight: 700; font-size: 40px; letter-spacing: 2px; color: var(--yellow); margin: 0 0 4px; overflow: hidden; line-height: 1.15; }
  .solved .solvedline { display: block; font-family: var(--font-display); font-weight: 700; color: var(--lime); font-size: var(--fs-body); margin: 0 0 8px; }
  .solved .btn-next { height: var(--h-btn-primary); animation: nextGlow 1.3s ease-in-out infinite alternate; }
  @keyframes nextGlow { from { box-shadow: 0 5px 0 #2e8a49, 0 0 16px #b8ff7a77; } to { box-shadow: 0 5px 0 #2e8a49, 0 0 36px #b8ff7add; } }

  /* ---------- caption bar (sizes in house.css) ---------- */
  #portrait { border-radius: 12px; background: #2e2357; }
  .who { color: var(--cyan); font-weight: 700; }
  .dev { display: flex; gap: 6px; align-items: center; background: #000c; border: 2px dashed var(--yellow); color: var(--yellow); font: 14px system-ui, sans-serif; }
  .dev select, .dev button { font: 14px system-ui, sans-serif; }
  .err { position: fixed; left: 0; right: 0; top: 0; background: #b00020; color: #fff; padding: 8px; z-index: 9; }

  /* ---------- Part 3: the quiz. Answer tiles are buttons; a wrong one is crossed out with its reason ---------- */
  .qbig { margin: 0 0 12px; font-family: var(--font-display); font-size: var(--fs-heading); line-height: 1.2; color: var(--yellow); text-shadow: 0 0 10px #fff27a55; animation: qIn .4s ease-out both; }
  .answers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .answer { padding: 8px 8px 10px; background: #ffffff10; color: var(--ink); font-family: var(--font-read); font-size: var(--fs-body); line-height: 1.2; display: flex; flex-direction: column; align-items: center; gap: 6px; animation: ansIn .4s ease-out both; }
  .answer canvas { width: 128px; height: 96px; image-rendering: pixelated; display: block; border-radius: 8px; }
  .answer .n { position: absolute; left: -10px; top: -12px; width: 30px; height: 30px; border-radius: 50%; background: var(--lav); color: #1b1433; font: 700 18px/1 var(--font-read); display: grid; place-items: center; }
  .answer .why { display: none; font-size: var(--fs-small); line-height: 1.25; color: var(--orange); text-decoration: none; }
  .answer.right { --accent: var(--lime); background: #b8ff7a33; }
  .answer.crossed { animation: shake .35s both; --accent: var(--orange); box-shadow: none; cursor: not-allowed; }
  .answer.crossed .nm { opacity: .6; text-decoration: line-through; }
  .answer.crossed canvas { opacity: .5; }
  .answer.crossed .why { display: block; }
  .answers .answer:nth-child(2) { animation-delay: .08s; } .answers .answer:nth-child(3) { animation-delay: .16s; }
  .answers.waiting .answer:not(.crossed) { animation: ansIn .4s ease-out both, ansPulse 1.5s ease-in-out .6s infinite; }
  .answers.waiting .answer:nth-child(2) { animation-delay: .08s, .8s; } .answers.waiting .answer:nth-child(3) { animation-delay: .16s, 1s; }
  @keyframes qIn { from { opacity: 0; transform: translateY(-14px) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes ansIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes ansPulse { 0%, 100% { box-shadow: 0 4px 0 var(--depth), 0 0 0 0 #7ff7ff00; } 50% { box-shadow: 0 4px 0 var(--depth), 0 0 18px 2px #7ff7ffaa; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  /* ---------- story time: the real photos / videos on the left, the facts on the right (the whole main area) ---------- */
  .play.story-active { grid-template-columns: minmax(0, 1fr) !important; align-items: stretch !important; }
  .play.story-active .play-board { display: none; }
  .play.story-active .play-ctrls { justify-content: stretch; }
  .play.story-active #p3Panel { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .play.story-active #p3Body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .st-page { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px; align-items: center; }
  .st-page.two { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
  .st-page .st-media { min-height: 0; align-self: stretch; }
  .st-page .st-fig { justify-content: center; animation: evidence-land 440ms cubic-bezier(.2,.8,.25,1) both; }
  .st-page .st-fig:nth-child(2) { animation-delay: 100ms; }
  .st-page .st-frame { flex: none; }
  .st-page .st-frame img, .st-page .st-frame video { width: 100%; height: 100%; max-width: none; object-fit: fill; display: block; }
  .st-page .st-frame video { object-fit: contain; }
  .st-facts { min-width: 0; display: flex; flex-direction: column; gap: 8px; align-content: center; }
  .st-facts h2 { margin: 0; font-size: var(--fs-heading); line-height: 1.1; color: var(--yellow); text-align: left; }
  #app .st-facts .facts { gap: 8px; }
  #app .st-facts .facts .fact { grid-template-columns: 220px minmax(0, 1fr); padding: 8px 14px; }
  #app .st-facts .facts .fact .fact-value { font-size: var(--fs-title); white-space: nowrap; overflow-wrap: normal; }
  .st-facts .fact-source { margin: 0; text-align: left; }
  @keyframes evidence-land { 0% { opacity: 0; transform: translateY(-32px) scale(1.12) rotate(-7deg); } 68% { opacity: 1; transform: translateY(3px) scale(.97) rotate(2deg); } 100% { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .st-page .st-fig { animation: none; } }

  /* ---------- cards ---------- */
  .closex { position: absolute; right: -14px; top: -14px; width: 52px; height: 52px; border-radius: 50%; cursor: pointer;
    border: 4px solid #fff3d6; background: radial-gradient(circle at 35% 30%, #ffb07a, #f2672e); color: #fff;
    font: 700 26px/1 system-ui, sans-serif; box-shadow: 0 0 0 3px #1b1433, 0 4px 0 #1b1433, 0 0 18px #ff8a5c88; }
  .closex:hover { filter: brightness(1.1); transform: translateY(-2px); }
  .closex:active { transform: translateY(2px); }
  .closex:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }
  .overlay { display: grid; place-items: center; background: #1b1433dd; z-index: 5; }
  .overlay .box { position: relative; text-align: center; background: var(--panel); border: 3px solid var(--cyan); border-radius: 24px; padding: 24px 36px; box-shadow: 0 0 40px #7ff7ff55; max-width: 680px; }
  .overlay h2 { font-size: var(--fs-heading); margin: 0 0 8px; color: var(--cyan); text-shadow: 0 0 12px #7ff7ff; }
  .overlay p { color: var(--muted); margin: 0 0 16px; }
  .mcard { text-align: left !important; }
  .mcard h2 { text-align: center; }
  .mcard .row { display: flex; justify-content: center; margin-top: 16px; }
  .badge { display: inline-block; font-size: var(--fs-small); padding: 2px 10px; border-radius: 999px; background: #ff7ad933; color: var(--pink); }
  .disc { font-size: var(--fs-small); color: var(--lav) !important; }
  .plist { display: grid; gap: 8px; }
  .plist > div { display: grid; grid-template-columns: 1fr 1.4fr 80px; gap: 10px; align-items: center; padding: 8px 14px; border-radius: 12px; background: #ffffff10; font-family: var(--font-read); font-size: var(--fs-body); }
  .diff { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
  .diff i { width: 14px; height: 14px; border-radius: 3px; background: #ffffff22; display: inline-block; }
  .diff i.on { background: var(--pink); }


  /* ---------- "Before you sew": the big explainer card (frame in house.css). The stage is 96 x 80 game px at 5x, each step tile the same at 2x ---------- */
  .bd-stage canvas { width: 480px; height: 400px; border-radius: 16px; border: 4px solid #1b1433; box-shadow: 0 0 0 3px var(--cyan), 0 0 26px #7ff7ff55; display: block; box-sizing: content-box; }
  .bd-label.s0 { color: var(--lime); } .bd-label.s1 { color: var(--cyan); } .bd-label.s2 { color: var(--yellow); } .bd-label.s3 { color: var(--pink); }
  .mvtiles { width: 428px; gap: 10px; }
  .mvtile canvas { width: 192px; height: 160px; }
  .mvtile.s0 { --accent: var(--lime); color: var(--lime); } .mvtile.s1 { --accent: var(--cyan); color: var(--cyan); }
  .mvtile.s2 { --accent: var(--yellow); color: var(--yellow); } .mvtile.s3 { --accent: var(--pink); color: var(--pink); }
  .mvtile.on { color: #1b1433; }
</style>

<body>
<div id="app" data-stage class="frame">
  <header class="hdr">
    <h1 class="hdr-title">Secret in the Stripes</h1>
    <div class="hdr-ctrls">
      <button class="hbtn hbtn-mission" id="missionBtn" title="See your mission">Your mission</button>
      <button class="hbtn hbtn-icon" id="helpBtn" aria-label="How to play: Before you sew" title="How to play">?</button>
      <button class="hbtn" id="voiceBtn" aria-pressed="true" title="Voice on or off (V)">🔊 Voice</button>
      <button class="hbtn" id="restartBtn" hidden title="Start this story again">↺ Restart</button>
    </div>
  </header>
  <div class="stepbar" id="stepbar" aria-live="polite"><span class="step-text" id="stepText"></span><span class="step-sub" id="stepSub"></span></div>

  <main class="play" id="playMain">
    <div class="play-board"><canvas id="game" width="320" height="200" aria-label="Game scene"></canvas></div>

    <div class="play-ctrls">
      <!-- Part 2 -->
      <section class="card" id="p2Panel" hidden>
        <p class="clue" id="clue"></p>
        <div class="words" id="strip"></div>
      </section>
      <section class="card solved" id="solvedPanel" hidden>
        <p class="solvedmsg" id="solvedMsg"></p>
        <div class="nextrow"><button class="btn-next go bignext" id="solvedNext">Next puzzle ▶</button>
        <button class="btn-replay" id="solvedReplay" hidden>↺ Replay</button></div>
      </section>
      <section class="card" id="p2Controls" hidden>
        <div class="keyhead"><p class="lbl" id="keyLbl">Stripe key</p><div class="readout" id="readout" hidden aria-live="polite"></div></div>
        <div class="skey" id="key" role="img" aria-label="Stripe key: the stripe pattern of every letter in the message"></div>
        <div class="controls">
          <button class="toolbtn" id="eraseBtn" title="Undo your last tap (⌫)"><i class="ico-eraser" aria-hidden="true"></i>Undo</button>
          <button class="toolbtn" id="clearBtn" title="Clear all your taps">✕ Clear</button>
          <button class="toolbtn" id="hintBtn" title="Hint (H)">💡 Hint</button>
          <button class="go" id="goBtn" title="Open the parachute and read the ring (Enter)">OPEN ▶</button>
        </div>
      </section>
      <!-- Part 3 -->
      <section class="card" id="p3Panel" hidden>
        <div id="p3Body"></div>
      </section>
    </div>
  </main>

  <footer>
    <canvas id="portrait" width="40" height="40" aria-hidden="true"></canvas>
    <div><div class="who" id="who"></div><div class="line" id="line" aria-live="polite"></div></div>
    <div class="cap-btns">
      <button class="toolbtn" id="backBtn" hidden title="Previous line (B)">◀ Back</button>
      <button class="next" id="nextBtn" data-cap-next hidden>Next ▶</button>
    </div>
  </footer>

  <div class="overlay" id="cardOverlay" hidden><div class="box mcard" id="cardBox"></div></div>

  <div class="overlay" id="startOverlay">
    <div class="box">
      <h2>Secret in the Stripes</h2>
      <p>The story of Perseverance's parachute. Turn your sound on!</p>
      <p class="disc">An imaginary adventure starring real space explorers.<br>The missions and discoveries you uncover really happened.</p>
      <button class="go" id="startBtn">Start ▶</button>
      <p style="margin:16px 0 0; font-size:var(--fs-small)">or press <kbd>Enter</kbd></p>
    </div>
  </div>
</div>

<div class="dev" id="devPanel" hidden>
  <b>DEV</b>
  <select id="devJump" aria-label="Jump to step">
    <option value="briefing">Fresh start</option><option value="landing">Watch the landing</option>
    <option value="meet">Meet Chute</option><option value="before">Before you sew card</option>
    <option value="puzzle1">Puzzle 1</option><option value="puzzle2">Puzzle 2</option><option value="puzzle3">Puzzle 3</option><option value="puzzle4">Puzzle 4</option>
    <option value="check">Why stripes? check</option><option value="story">Story time</option><option value="gift">Gift box</option>
    <option value="bench">Fit the camera mast</option>
    <option value="complete">Mission complete</option>
  </select>
  <button id="devGo">Go</button><button id="devReset">Reset save</button>
</div>

// Modelled on NASA's photo PIA24431: a pale vent in the middle, the disk of white and orange gores
// with their seams, a dark gap ring, then the outer band (owner, 2026-11-14: "more like reality").
// Gore layout: for every ring, which item and which of its 7 stripes each of the 80 gores carries.
const LAYOUT = (() => {

    const arr = new Array(GORES).fill(null);

    const [r0, r1] = ringBounds(ring), dim = active.length && !active.includes(ring);
    for (let i = 0; i < GORES; i++) {
      const cell = LAYOUT[ring].arr[i];

      if (cell === "start") c = P.startMark;
      else if (!cell) c = ring === 3 ? P.cloth : P.gore;                 // filler: orange in the disk, white in the band

        const m = p ? blankAt(p, LAYOUT[ring].name, cell.item) : -1;

// One small looping picture per step, drawn with the game's own canopy, palette and stripe colours. The demo word is FOX with the O

const pat = (it, cls = "") => `<div class="st">${bitsOf(it).map(x => `<i class="${x ? "on" : ""}"></i>`).join("")}</div>`;
const STEPS = [["Guess word", "Guess"], ["Find letter", "Find"], ["Tap stripes", "Tap"], ["Press OPEN", "Open"]];
const DEMO = { word: ["F", "O", "X"], blank: 1 };
const DEMO_W = 96, DEMO_H = 80, DEMO_LOOP = 3.2;
function demoDraw(g, step, t) {                       // 96 x 80 game pixels
  const p = Math.min(1, (t % DEMO_LOOP) / DEMO_LOOP), K = k => ease(Math.max(0, Math.min(1, k)));
  const S = g.canvas.width / DEMO_W;              // drawn at the size it is shown (owner, 2026-11-15: "can it not be so pixelated?"): shapes stay sharp, letters smooth
  g.setTransform(S, 0, 0, S, 0, 0); g.globalAlpha = 1; g.imageSmoothingEnabled = false; g.textBaseline = "alphabetic";
  g.fillStyle = PAL.night; g.fillRect(0, 0, DEMO_W, DEMO_H);
  g.fillStyle = "#ffffff30"; for (let i = 0; i < 14; i++) g.fillRect((i * 37 + 5) % DEMO_W, (i * 53 + 3) % DEMO_H, 1, 1);
  const txt = (str, x, y, px, col) => { g.font = `${px}px "Jersey 15", monospace`; g.textAlign = "center"; g.fillStyle = col; g.fillText(str, x, y); };
  const O_BITS = bitsOf("O"), onAll = O_BITS.map((x, k) => x ? k : -1).filter(k => k >= 0);
  const row = (y, sh, onSet, q, qcol) => {            // the word: three columns of seven stripes, the blank one tappable
    DEMO.word.forEach((L, i) => {
      const x0 = 3 + i * 30, blank = i === DEMO.blank, b = bitsOf(L);
      for (let k = 0; k < 7; k++) { g.fillStyle = (blank ? onSet.includes(k) : b[k]) ? P.gore : P.cloth; g.fillRect(x0 + 2 + k * 4, y, 3, sh); }
      if (blank) { g.fillStyle = "#00000066"; g.fillRect(x0 + 5, y + sh + 3, 20, 16); }
      txt(blank ? q : L, x0 + 15, y + sh + 16, 14, blank ? qcol : "#ffffff");
    });
  };
  const keyCell = (x, y, w, L, hl) => {               // one cell of the stripe key
    g.fillStyle = hl ? PAL.neonYellow : "#ffffff1a"; g.fillRect(x, y, w, 28);
    txt(L, x + w / 2, y + 12, 11, hl ? PAL.night : "#ffffff");
    const b = bitsOf(L), x1 = x + Math.round((w - 20) / 2);
    for (let k = 0; k < 7; k++) { g.fillStyle = b[k] ? P.gore : P.cloth; g.fillRect(x1 + k * 3, y + 16, 2, 9); }
  };
  if (step === 0) {                                   // 1 Guess the word: the clue, a bouncing "?", then the guess is right
    const guess = p < 0.3 ? "?" : p < 0.5 ? "A" : p < 0.7 ? "U" : "O", col = p < 0.3 ? PAL.neonYellow : p < 0.7 ? "#ffab6b" : PAL.neonLime;
    row(10, 24, [], guess, col);
    if (p >= 0.7) { g.strokeStyle = PAL.neonLime; g.lineWidth = 2; g.beginPath(); g.moveTo(66, 24); g.lineTo(70, 30); g.lineTo(78, 18); g.stroke(); }
    txt("A sly ___", 48, 68, 12, PAL.neonYellow);
  } else if (step === 1) {                            // 2 Find the letter in the key: a highlight scans the key and stops on O
    row(3, 14, [], "?", PAL.neonYellow);
    const hi = p < 0.25 ? 3 : p < 0.5 ? 2 : 1;
    ["F", "O", "W", "X"].forEach((L, i) => keyCell(3 + i * 23, 50, 21, L, i === hi));
    if (p >= 0.5) { g.strokeStyle = PAL.neonYellow; g.lineWidth = 1; g.setLineDash([2, 2]); g.beginPath(); g.moveTo(48, 37); g.lineTo(36, 49); g.stroke(); g.setLineDash([]); }
  } else if (step === 2) {                            // 3 Tap its stripes: a finger taps the white stripes until they match the key
    const th = [0.12, 0.32, 0.52, 0.72], tgt = onAll, sx = k => 3 + 30 + 2 + k * 4 + 1.5;
    const on = tgt.filter((_, i) => p >= th[i]);

        ...(people ? [{ type: "img", src: STORY_MEDIA + "people-parachute.jpg", cap: people.caption, link: people.source, credit: people.credit, alt: people.alt }] : [])],
      facts: [["7 stripes", "Together they make one letter; orange stripes are worth 64, 32, 16, 8, 4, 2, 1"], ["3 words", "The words DARE MIGHTY THINGS, JPL's motto, with one word on each ring"], ["34° 11′ 58″ N", "The code on the outer band, which gives the place on Earth where JPL is"]],
      src: "https://www.jpl.nasa.gov/images/pia24431-mars-decoder-ring/" },
    { kicker: "Why I was left behind", title: "Too fast to land", line: LINE("pc.story.030"),
      media: [{ type: "video", src: NASA.descentVideo, poster: NASA.descentPoster, cap: "The last moments of the landing from the spacecraft's cameras: the sky crane lowers the rover to the ground", link: "https://science.nasa.gov/resource/perseverance-rovers-descent-and-touchdown-on-mars-onboard-camera-views/", credit: "NASA/JPL-Caltech" }],
      facts: [], src: PRESS_KIT },
    { kicker: "Where I ended up", title: "A quiet spot on Mars", line: Voice.story("parachute", 2),
      media: [{ type: "img", src: NASA.flight26, cap: "Me and my backshell, photographed by Ingenuity on Flight 26 (PIA25217)", link: "https://www.jpl.nasa.gov/images/pia25217-rover-landing-gear-seen-from-the-air-by-mars-helicopter/", credit: "NASA/JPL-Caltech" }],
      facts: [["April 19, 2022", "The date of Ingenuity's Flight 26, when it photographed me and my backshell from the air"], ["126 km/h", "How fast the backshell was going when it hit the ground"], ["No damage", "Engineers saw my canopy came through opening safely, then used the pictures to plan future missions"]],
      src: "https://www.nasa.gov/missions/mars-2020-perseverance/ingenuity-helicopter/nasas-mars-helicopter-spots-gear-that-helped-perseverance-rover-land/" },
  ];
}
function storyPagesFor(id, story) {
  if (id === "parachute") return parachutePages(story);
  return story.lines.map((text, i) => ({ kicker: "Story time", title: story.title, line: Voice.story(id, i), media: story.images?.[i] ? [{ type: "img", src: STORY_MEDIA + story.images[i] + ".jpg", cap: story.title, link: story.source, credit: story.credit }] : [], facts: [] }));
}
const RATIO = { video: 16 / 9 };                       // known proportions; a photo's own size is read when it loads
function mediaHTML(m, i) {
  const el = m.type === "video"
    ? `<video src="${m.src}" poster="${m.poster || ""}" ${m.controls ? "controls " : ""}autoplay loop muted playsinline preload="auto" aria-label="${m.cap}"></video>`
    : `<img src="${m.src}" alt="${m.alt || m.cap}">`;
  return `<figure class="st-fig"><div class="st-frame" data-ratio="${m.ratio || RATIO[m.type] || 1.5}">${el}</div><figcaption class="st-credit">${m.cap} · <a href="${m.link}" target="_blank" rel="noopener">${m.credit}</a></figcaption></figure>`;
}
// Each picture is sized to its own proportions inside its column (equal columns when there are two): no black letterbox bars.
function layoutMedia() {
  const wrap = document.querySelector("#p3Body .st-media"); if (!wrap) return;
  const figs = [...wrap.children], n = figs.length, gap = 14, colW = Math.floor((wrap.clientWidth - gap * (n - 1)) / n), H = wrap.clientHeight;
  figs.forEach(f => {
    const fr = f.querySelector(".st-frame"), cap = f.querySelector("figcaption"), el = fr.querySelector("img, video");
    const nat = el.tagName === "VIDEO" ? (el.videoWidth && el.videoHeight ? el.videoWidth / el.videoHeight : 0) : (el.naturalWidth && el.naturalHeight ? el.naturalWidth / el.naturalHeight : 0);
    const r = nat || +fr.dataset.ratio || 1.5;
    let w = colW - 6, h = 0;
    for (let k = 0; k < 3; k++) {                       // the caption's height depends on the picture's width, which depends on the room left
      cap.style.maxWidth = (w + 6) + "px";
      const room = H - cap.offsetHeight - 8 - 6;
      w = Math.min(colW - 6, Math.floor(room * r)); h = Math.floor(w / r);
    }
    fr.style.width = (w + 6) + "px"; fr.style.height = (h + 6) + "px"; cap.style.maxWidth = (w + 6) + "px";
  });
}
function wireMedia(page) {
  page.querySelectorAll("img").forEach(im => {
    im.addEventListener("load", layoutMedia);
    im.addEventListener("error", () => { im.closest("figure")?.remove(); layoutMedia(); });
  });
  page.querySelectorAll("video").forEach(v => v.addEventListener("loadedmetadata", layoutMedia));   // stage.js plays it muted and shows the one big play button
}
async function storyTime(id) {
  const story = window.restoreOppyStories?.[id];
  if (!story) { S.progress.p3.story = true; saveProgress(); return; }      // story file missing: skip, never block the game
  S.phase = "story"; S.scene = "story"; S.parts = [];
  const pages = storyPagesFor(id, story), main = document.getElementById("playMain");
  main.classList.add("story-active");
  for (let i = 0; i < pages.length;) {
    const pg = pages[i], dots = pages.map((_, k) => `<i class="${k === i ? "on" : k < i ? "done" : ""}"></i>`).join("");
    p3Panel(`<div class="st-top"><span class="st-title">${story.title}</span><span class="st-part">Part ${i + 1} of ${pages.length}</span><span class="st-dots" aria-hidden="true">${dots}</span></div>
      <div class="st-page${pg.media.length > 1 ? " two" : ""}"><div class="st-media">${pg.media.map(mediaHTML).join("")}</div>
        <div class="st-facts"><h2>${pg.title}</h2>
          <ul class="facts">${pg.facts.map(([big, small]) => `<li class="fact"><b class="fact-value">${big}</b><span class="fact-text">${small}</span></li>`).join("")}</ul>
          ${pg.src ? `<p class="fact-source">Facts from <a href="${pg.src}" target="_blank" rel="noopener">NASA</a></p>` : ""}</div></div>`);
    layoutMedia(); wireMedia(document.getElementById("p3Body"));
    const steps = packSteps(pg.line, 340);          // a part is one click (captions.js pages a long line by itself); only a very long text takes two
    let k = 0, r = "next";
    while (k < steps.length) { r = await say(steps[k], { next: true, back: i > 0 || k > 0 }); if (r === "back") { if (k > 0) k--; else break; } else k++; }
    i = r === "back" ? Math.max(0, i - 1) : i + 1;
  }
  document.getElementById("p3Body").innerHTML = ""; main.classList.remove("story-active");
  S.progress.p3.story = true; saveProgress();
}

// --- gift box, fitting scene ---
async function giftReveal() {
  S.phase = "gift"; renderStep();
  const f = PART_ORDER.indexOf(PART.key), b = PART.box;
  const open = giftBox({
    name: PART.name, line: PART.line, size: [b.w * 3, b.h * 3], fast: FAST,
    draw: (g, w, h) => { g.imageSmoothingEnabled = false; g.drawImage(img.oppyParts, f * 64 + b.x, b.y, b.w, b.h, 0, 0, w, h); },
  });
  say(Voice.step([LINE("pc.gift.010"), LINE("pc.gift.020")]));
  await open; S.giftOpened = true;
}
// Fitting scene: Oppy is drawn as the base plus every part already earned (oppy.hub), then the mast flies in and lands.
const FIT = { x: 150, mast: false, dx: 0, dy: 0, eye: 0, hop: 0 };
function earnedParts() {
  let parts = {}; try { parts = JSON.parse(localStorage.getItem("oppy.hub"))?.parts || {}; } catch {}
  const out = {}; for (const [layer, id] of Object.entries(PART_MISSION)) out[layer] = !!parts[id]; return out;
}
function drawFit(now) {
  drawGround(now);
  const k = 2, x0 = snap(FIT.x - 32 * k), y0 = snap(GROUND - 56 * k - FIT.hop);
  shadow(FIT.x, GROUND - 1, 56, 4);
  const layer = (name, dx = 0, dy = 0) => cx.drawImage(img.oppyParts, PART_ORDER.indexOf(name) * 64, 0, 64, 56, snap(x0 + dx * k), snap(y0 + dy * k), 64 * k, 56 * k);
  layer("base");
  const have = FIT.earned || {};
  for (const n of ["wheels", "arm", "antenna"]) if (have[n]) layer(n);
  if (FIT.mast) {
    layer("mast", FIT.dx, FIT.dy);
    if (FIT.eye < 1) {                              // eyes still shut (or opening): cover the camera lenses with the lid colour
      const mx = x0 + FIT.dx * k, my = y0 + FIT.dy * k, rows = FIT.eye <= 0 ? [3, 7] : [3, 5];
      for (const ex of [38, 48]) {
        cx.fillStyle = "#cdd6ea"; cx.fillRect(snap(mx + ex * k), snap(my + rows[0] * k), 5 * k, (rows[1] - rows[0] + 1) * k);
        cx.fillStyle = "#2a1f4a"; cx.fillRect(snap(mx + ex * k), snap(my + (rows[1] - 1) * k), 5 * k, k);
      }
    }
  }
  if (have.panels) layer("panels");
  drawCuriosity(now, C.x);
}
async function fitMast() {
  S.phase = "fit"; S.scene = "fit"; show("none"); S.parts = [];
  FIT.earned = earnedParts(); FIT.mast = false; FIT.dx = 0; FIT.dy = 0; FIT.eye = 0; FIT.hop = 0;
  // Close-up of Oppy alone (owner, 2026-11-15: Oppy is about half Curiosity's length, never bigger); Curiosity talks through the caption bar.
  O.show = false; CH.show = false; C.show = false; setA(C, "idle");
  await say(LINE("pc.bench.010"), { next: true });
  FIT.mast = true;
  const mx = FIT.x - 64 + PART.mount.x * 2, my = GROUND - 112 + PART.mount.y * 2;
  const fly = REDUCED ? 1 : 1100;
  await tween(fly, t => { const e = 1 - ease(t); FIT.dx = 34 * e; FIT.dy = -70 * e - Math.sin(t * Math.PI) * 10 * (1 - t); });
  FIT.dx = 0; FIT.dy = 0;                           // exactly on its layer position
  sparkle(mx, my, 16);
  if (!REDUCED) await tween(260, t => { FIT.hop = Math.sin(t * Math.PI) * 3; });
  FIT.hop = 0;
  for (const e of [0.5, 1]) { await wait(REDUCED ? 1 : 380); FIT.eye = e; }          // Oppy opens its eyes
  sparkle(mx - 4, my - 16, 14); react("happy", 2000);
  await say(LINE("pc.bench.020"), { next: true });
  await say(LINE("pc.bench.030"), { next: true });
  S.progress.p3.packed = true; saveProgress();
}
async function chapterComplete() {
  S.phase = "complete"; renderStep();
  say(LINE("pc.end.010"));
  await showMissions("MISSION COMPLETE!", "DONE ✓");
}

// ---------- keyboard ----------
addEventListener("keydown", e => {
  const k = e.key, onButton = document.activeElement?.tagName === "BUTTON";
  if (S.phase === "start") { if (k === "Enter" || k === " ") { e.preventDefault(); begin(); } return; }
  if (k === "`") return;
  if (k === "v" || k === "V") return voiceBtn.click();
  if ((k === "b" || k === "B") && nextResolve && !document.getElementById("backBtn").hidden) return nextResolve("back");
  if (cardResolve) { if (k === "Enter" || k === " " || (k === "Escape" && document.querySelector(".closex"))) { e.preventDefault(); cardResolve(); } return; }
  if (solvedResolve) { if (k === "Enter" || k === " ") { e.preventDefault(); solvedResolve(); } return; }
  if (nextResolve && (k === "Enter" || k === " ")) { e.preventDefault(); return nextResolve(); }
  if (S.phase === "p3check" && ["1", "2", "3"].includes(k)) return pickAnswer(ANSWERS[+k - 1], document.querySelectorAll(".answer")[+k - 1]);
  if (S.phase !== "p2") return;
  const p = PUZZLES[S.board];
  if (k >= "1" && k <= "7") return tap(S.cur, +k - 1);
  if (k === "ArrowLeft" || k === "ArrowRight") { e.preventDefault(); S.cur = (S.cur + (k === "ArrowRight" ? 1 : p.blanks.length - 1)) % p.blanks.length; return renderStrip(); }
  if (k === "Backspace" || k === "Delete") { e.preventDefault(); return eraseMove(); }
  if (k === "h" || k === "H") return hint();
  if ((k === "Enter" || k === " ") && !(onButton && !["goBtn"].includes(document.activeElement.id) && !document.activeElement.classList.contains("stripe"))) { e.preventDefault(); return go(); }
});
document.getElementById("eraseBtn").onclick = eraseMove;
document.getElementById("clearBtn").onclick = clearPlan;
document.getElementById("hintBtn").onclick = () => hint();
document.getElementById("goBtn").onclick = go;
document.getElementById("restartBtn").onclick = () => {
  if (!confirm("Start this story again? Your progress will be cleared.")) return;
  S.progress = { p1: false, boards: {}, p3: {}, intro: false }; saveProgress(); location.reload();
};

// ---------- self-check: every puzzle decodes to the real text, and best moves rise ----------
function selfCheck() {
  const errs = []; let last = 0;
  for (const [name, items] of Object.entries(RINGS)) items.forEach(it => { if (num(it) !== sumOf(bitsOf(it))) errs.push(`${name}: ${it} does not fit 7 stripes`); });
  PUZZLES.forEach((p, i) => {
    const route = fullRoute(p), r = judge(p, route);
    if (r.end !== "success") errs.push(`puzzle ${i + 1}: the full route does not read right`);
    if (route.length + 1 !== p.fewest) errs.push(`puzzle ${i + 1}: best is ${route.length + 1}, data says ${p.fewest}`);
    if (p.fewest <= last) errs.push(`puzzle ${i + 1}: best moves do not rise`);
    last = p.fewest;
  });
  if (errs.length) { const d = document.createElement("div"); d.className = "err"; d.textContent = "Puzzle check failed: " + errs.join("; "); document.body.append(d); }
  return errs;
}

// ---------- developer menu ----------
const QS = new URLSearchParams(location.search), DEV = QS.has("dev") && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname); // dev tools only on the developer's own computer, never for players (owner, 2026-11-15: "remove the dev mode")
document.getElementById("devPanel").hidden = !DEV;
if (QS.get("jump")) document.getElementById("devJump").value = QS.get("jump");
document.getElementById("devGo").onclick = () => { location.search = "?dev=1&jump=" + document.getElementById("devJump").value; };
document.getElementById("devReset").onclick = () => { try { localStorage.removeItem("pc.progress"); } catch {} location.search = "?dev=1"; };
function devProgress(upto, p3 = {}) {
  const pr = { p1: true, boards: {}, p3, intro: true };
  PUZZLES.forEach((b, i) => { if (i < upto) pr.boards[b.id] = { done: true }; });
  S.progress = pr; saveProgress(); renderBoards(); renderMission();
}
async function finishP3() { S.progress.p3.done = true; saveProgress(); renderMission(); await chapterComplete(); }
const JUMP = {
  briefing: async () => { S.progress = { p1: false, boards: {}, p3: {}, intro: false }; await landing(); await meetChute(); startPuzzles(); },
  landing: async () => { S.progress = { p1: false, boards: {}, p3: {}, intro: false }; await landing(); await meetChute(); startPuzzles(); },
  meet: async () => { devProgress(0); S.progress.intro = false; await meetChute(); startPuzzles(); },
  before: async () => { devProgress(0); S.progress.intro = false; startPuzzles(); },
  puzzle1: () => { devProgress(0); startBoard(0); }, puzzle2: () => { devProgress(1); startBoard(1); },
  puzzle3: () => { devProgress(2); startBoard(2); }, puzzle4: () => { devProgress(3); startBoard(3); },
  check: () => { devProgress(4); startPart3(); },
  story: () => { devProgress(4, { check: true }); startPart3(); },
  gift: () => { devProgress(4, { check: true, story: true }); startPart3(); },
  bench: async () => { devProgress(4, { check: true, story: true }); await fitMast(); finishP3(); },
  drop: async () => { devProgress(4, { check: true, story: true, packed: true }); await fitMast(); finishP3(); },
  complete: () => { devProgress(4, { check: true, story: true, packed: true, done: true }); chapterComplete(); },
};
async function startPuzzles() {
  const i = PUZZLES.findIndex(b => !S.progress.boards[b.id]?.done);
  if (!S.progress.intro) { S.phase = "before"; show("none"); await beforeCard(); await puzzlesOverview(); S.progress.intro = true; saveProgress(); }
  startBoard(Math.max(0, i));
}
async function begin() {
  if (S.phase !== "start") return;
  document.getElementById("startOverlay").hidden = true;
  S.phase = "boot"; renderBoards(); renderMission();
  if (!S.progress.p1) { await landing(); await meetChute(); return startPuzzles(); }
  if (PUZZLES.some(b => !S.progress.boards[b.id]?.done)) return startPuzzles();
  if (!S.progress.p3.done) return startPart3();
  startBoard(0); showMissions("MISSION COMPLETE!", "CLOSE");
}
document.getElementById("startBtn").onclick = begin;
Promise.all(["chute", "rover", "backshell", "curiosity", "curiosityFull", "oppy", "oppyWheel", "oppyParts"].map(load)).then(() => {
  CANOPY_FULL = canopyCanvas(128);
  fit(); renderStep(); selfCheck(); requestAnimationFrame(render);
  document.fonts?.ready.then(() => { if (S.phase === "p2" && !document.getElementById("p2Panel").hidden) fitWords(); });   // the letters' widths change when the fonts arrive
  if (DEV && QS.get("jump") && JUMP[QS.get("jump")]) { document.getElementById("startOverlay").hidden = true; S.phase = "boot"; JUMP[QS.get("jump")](); }
  window.__td = { S, C, O, CH, PUZZLES, RINGS, LAYOUT, judge, stripesOf, onCourse, routeFrom, fullRoute, startBoard, startPart3, tap, hint, go, eraseMove, removeSel, clearPlan, undo, selfCheck, fitMast, giftReveal, FIT, PART };   // for testing
});
