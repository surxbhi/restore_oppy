<!-- Prototype game shell. Generated by tools/build_hub.mjs from restore-oppy.template.html: edit the template. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Jersey+15&display=swap" rel="stylesheet">
<style>
  /* Restore Oppy shell on the scaled stage (owner, 2026-11-15: "Current HTML and canvas, plus a scaled stage"):
     every size inside #app is a design pixel on the 1280 x 720 stage (stage.js scales it as one unit).
     The frame, buttons, caption bar, fact rows and story chrome come from house.css.
     The mission overlay (the mini-game's iframe) is OUTSIDE the stage on purpose: each mini-game scales itself to its own window. */
  :root {
    --night: #1b1433; --night2: #2e2357; --panel: #261c48; --ink: #f6f0ff; --muted: #b9acdf;
    --pink: #ff7ad9; --cyan: #7ff7ff; --lime: #b8ff7a; --yellow: #fff27a; --lav: #c6a8ff; --orange: #ffab6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font-family: "Jersey 15", system-ui, sans-serif; font-size: 20px;
    background:
      radial-gradient(2px 2px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(2px 2px at 78% 12%, #7ff7ffaa 50%, transparent 51%),
      radial-gradient(2px 2px at 44% 82%, #ff7ad9aa 50%, transparent 51%),
      radial-gradient(2px 2px at 90% 70%, #fff8 50%, transparent 51%),
      linear-gradient(180deg, #1b1433 0%, #2a1d52 60%, #3b2266 100%);
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: var(--ink); }
  button:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }

  /* the frame: the shell has no step banner, so the main area takes its row too: header 52 | main 524 | caption bar 108 */
  #app.frame { grid-template-rows: var(--hdr-h) minmax(0, 1fr) var(--bar-h) !important; }
  #app .play { height: auto; align-self: stretch; }
  #side { overflow: hidden; }
  #side:empty { display: none; }
  .cvwrap { position: relative; line-height: 0; }
  canvas#game { image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 14px; box-shadow: 0 0 0 3px #7ff7ff55, 0 0 40px #ff7ad944; background: var(--night); }
  .label { color: var(--muted); font-size: var(--fs-label); margin: 0 0 8px; }
  .hint { font-size: var(--fs-small); color: var(--muted); margin: 8px 0 0; }
  .fullw { width: 100%; }

  /* ---- the map (owner, 2026-11-15) ----
     No side panel: the canvas fills the main area at a whole-number pixel factor (--k design px per canvas pixel).
     Flags, machines, the route and Curiosity are drawn on the canvas; names, the Play button and the progress strip are real HTML over it.
     CLICKABLE: the name signs (raised, accent border, depth edge) and the Play button. INFORMATION: the progress strip (flat). */
  #sites { position: absolute; inset: 0; line-height: 1.1; }
  .site { position: absolute; width: calc(var(--k, 2) * 70px); height: calc(var(--k, 2) * 46px); transform: translate(-50%, -100%); padding: 0; border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; border-radius: 10px; }
  .site .nm { position: absolute; left: 50%; top: calc(100% + 2px); transform: translateX(-50%); padding: 2px 12px; border-radius: var(--radius); border: 2px solid var(--accent, var(--cyan)); background: #f3dcae; color: #3a2218;
    font: 700 var(--fs-label)/1.25 var(--font-display); white-space: nowrap; box-shadow: 0 4px 0 var(--depth); transition: transform .08s, box-shadow .08s, border-color .08s, background .08s; }
  .site.done .nm { background: #c9f59a; }
  .site.sel .nm { background: var(--accent, var(--yellow)); color: #1b1433; }
  .site:hover .nm, .site:focus-visible .nm { background: #fff7c2; border-color: #fff; transform: translateX(-50%) translateY(-2px); box-shadow: 0 6px 0 var(--depth); }
  .site.sel:hover .nm, .site.sel:focus-visible .nm { background: var(--accent, var(--yellow)); }
  .site:active .nm { transform: translateX(-50%) translateY(2px); box-shadow: 0 1px 0 var(--depth); }
  .site:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .site.nope { animation: shake .35s; }
  @keyframes shake { 25% { transform: translate(calc(-50% - 6px), -100%); } 75% { transform: translate(calc(-50% + 6px), -100%); } }
  #playWrap { position: absolute; z-index: 3; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -100%); pointer-events: none; }
  #playWrap > * { pointer-events: auto; }
  #playBtn { white-space: nowrap; animation: nudge 1s ease-in-out infinite alternate; }
  #playWrap .arrow { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 18px solid var(--lime); filter: drop-shadow(0 2px 0 #1b1433); animation: hop .6s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes hop { from { transform: translateY(-2px); } to { transform: translateY(7px); } }
  @keyframes nudge { to { transform: scale(1.04); box-shadow: 0 0 34px #b8ff7acc; } }
  /* progress on the map: five slots in route order; a "?" until the part is earned (owner: "show the progress of solving the games as well") */
  #mapTop { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 6px 14px; border-radius: var(--radius); background: #1b1433d9; z-index: 2; cursor: default; }
  #mapTop .slots { display: flex; gap: 8px; }
  #mapTop .slot { position: relative; width: 52px; height: 36px; border-radius: 8px; background: #3a2d66; display: grid; place-items: center; color: var(--yellow); font: 700 24px/1 var(--font-display); }
  #mapTop .slot canvas { width: 48px; height: 32px; image-rendering: pixelated; border-radius: 6px; background: #efe3cf; display: block; }
  #mapTop .slot.got { background: #efe3cf; }
  #mapTop .slot .tk { position: absolute; right: -8px; top: -10px; width: 22px; height: 22px; border-radius: 50%; background: var(--lime); color: #1b1433; font: 700 16px/22px var(--font-read); text-align: center; }
  #mapTop .slot.pop { animation: pop .7s; }
  @keyframes pop { 30% { transform: scale(1.35); } 100% { transform: scale(1); } }
  #mapTop .cnt { font: 700 var(--fs-label)/1 var(--font-read); color: var(--yellow); white-space: nowrap; }
  #teamAgain { position: absolute; right: 10px; bottom: 10px; z-index: 2; line-height: 1; }

  /* ---- the title screen: one whole-number pixel factor on the 1280 x 720 stage ---- */
  #startOverlay { position: absolute; inset: 0; z-index: 6; background: #1b1433; overflow: hidden; }
  #titleCv { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #startOverlay .ttl { position: absolute; left: 0; right: 0; top: 22px; margin: 0; text-align: center; font-family: var(--font-display); font-weight: 700; line-height: 1; letter-spacing: .02em; color: #fff27a;
    font-size: 94px; -webkit-text-stroke: 6px #1b1433; paint-order: stroke fill; text-shadow: 4px 5px 0 #ff7ad9, -3px -2px 0 #7ff7ff; }
  #startOverlay .sub { position: absolute; left: 50%; top: 130px; transform: translateX(-50%); width: fit-content; max-width: 1200px; margin: 0; text-align: center; text-wrap: balance;
    font: 700 var(--fs-step)/1.3 var(--font-read); color: #fff; background: #1b1433b8; padding: 6px 14px; border-radius: 12px; }
  #startOverlay .acts { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #startOverlay .acts .row { display: flex; gap: 14px; align-items: center; justify-content: center; }
  #startOverlay .acts .hintline { margin: 0; font: 400 var(--fs-small)/1.3 var(--font-read); color: #fff; background: #1b1433b8; padding: 2px 10px; border-radius: 8px; }

  /* "Meet Curiosity" and "Meet Opportunity": illustrated NASA stories (owner, 2026-11-15). Fixed layout on the stage (main area 1248 x 524):
     a top row (page counter, dots, Skip), then the real NASA picture on the left and the facts on the right in the shared fact classes.
     Panorama pages put the picture across the full width, the words under it. */
  .play.story-full { grid-template-columns: minmax(0, 1fr) !important; }
  .play.story-full > .play-board, .play.story-full > .play-ctrls { display: none; }
  .storyfull { display: flex; flex-direction: column; gap: 8px; width: 100%; height: 100%; min-height: 0; min-width: 0; }
  .storyfull .st-top { flex: none; margin: 0; height: 44px; }
  .storyfull .st-top .btn-replay { flex: none; white-space: nowrap; }
  .storyfull .st-top .st-part { font-size: var(--fs-label); }
  .ns-body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 752px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 24px; }
  .ns-body figure { margin: 0; min-height: 0; min-width: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 6px; }
  .ns-body .pframe { position: relative; min-height: 0; min-width: 0; display: grid; place-items: center; }
  .ns-body .st-frame { border-radius: 4px; }
  .ns-body .pic { position: relative; width: 10px; height: 10px; }
  .ns-body .pic img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .ns-body .st-tag.map { background: var(--cyan); }
  .ns-info { display: flex; flex-direction: column; justify-content: center; gap: 12px; min-height: 0; min-width: 0; }
  .ns-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .ns-title h2 { margin: 0; font-size: var(--fs-heading); color: var(--yellow); line-height: 1.1; min-width: 0; }
  .ns-title canvas.ns-sprite { flex: none; image-rendering: pixelated; image-rendering: crisp-edges; height: auto; }
  .ns-info .facts .fact { grid-template-columns: minmax(min-content, .42fr) minmax(0, 1fr); }      /* the value column is never narrower than its longest word (no mid-word breaks) */
  .ns-info .facts .fact .fact-value { overflow-wrap: normal; }
  .ns-info .fact-source { margin: 0; line-height: 1.35; }
  /* panorama pages: the picture runs the full width, the words sit under it in one compact band */
  .storyfull.wide .ns-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; align-content: center; gap: 8px; }
  .storyfull.wide .ns-info { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 0 12px; justify-content: stretch; }
  .storyfull.wide .facts { grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); align-content: center; }
  .storyfull.wide .facts .fact { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .storyfull.wide .ns-body figure { grid-template-rows: auto auto; }

  .hdr .hbtn { font-family: var(--font-display); }
  .bigoppy { width: 192px; height: 168px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; margin: 0 auto 8px; }   /* the 64 x 56 sprite at exactly 3x */

  /* the closing story shares the NASA-story layout; a page with two pictures puts them side by side in the left column */
  .ns-figs { display: grid; grid-template-columns: repeat(var(--np, 1), minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: 12px; min-height: 0; min-width: 0; }
  .ns-figs figure .st-credit { font-size: var(--fs-small); line-height: 1.25; }
  .storyfull .st-title { white-space: nowrap; }

  /* the caption bar is house.css; the portrait and the speaker name as in the games */
  #portrait { border-radius: 12px; background: #2e2357; }
  .who { color: var(--cyan); font-weight: 700; }

  /* cards and overlays: inside the stage, the same as the games */
  .overlay { display: grid; place-items: center; background: #1b1433dd; z-index: 8; }
  .overlay .box { position: relative; text-align: center; background: var(--panel); border: 3px solid var(--cyan); border-radius: 24px; padding: 24px 36px; box-shadow: 0 0 40px #7ff7ff55; width: 680px; }
  .overlay h2 { margin: 0 0 8px; color: var(--cyan); text-shadow: 0 0 12px #7ff7ff; }
  .overlay p { color: var(--ink); margin: 0 0 14px; font-family: var(--font-read); }
  .box .row { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; text-align: left; margin: 14px 0 0; }
  .twocol > div { padding: 12px 16px; font-family: var(--font-read); font-size: var(--fs-label); line-height: 1.3; }   /* information: flat (.info) */
  .twocol b { display: block; margin-bottom: 4px; }
  .real b { color: var(--lime); } .pretend b { color: var(--pink); }

  /* the team finale: names and the title are real HTML over the canvas; --u is one canvas pixel in design pixels (set in fit()) */
  #finale { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 14px; line-height: 1.05; text-align: left; --acc: #fff; }
  #finale .fbeat { position: absolute; left: calc(var(--u) * 10); top: calc(var(--u) * 50); width: calc(var(--u) * 142); }
  .frole { display: inline-block; padding: calc(var(--u) * 1.5) calc(var(--u) * 5); background: var(--acc); color: #1b1433; font-size: max(16px, calc(var(--u) * 7)); font-weight: 700; letter-spacing: .08em; transform: skewX(-10deg); animation: fslide .25s ease-out both; }
  .fname { display: block; margin-top: calc(var(--u) * 4); font-size: max(20px, calc(var(--u) * 16.5)); font-weight: 700; color: #fff; white-space: nowrap; transform: skewX(-6deg); transform-origin: left bottom;
    -webkit-text-stroke: calc(var(--u) * 1.6) #1b1433; paint-order: stroke fill; text-shadow: calc(var(--u) * 1.4) calc(var(--u) * 1.4) 0 var(--acc); animation: fslam .3s cubic-bezier(.2, 1.5, .4, 1) .05s both; }
  .fpower { display: inline-block; max-width: 100%; margin-top: calc(var(--u) * 5); padding: calc(var(--u) * 2) calc(var(--u) * 5); background: #1b1433; border-left: calc(var(--u) * 2.5) solid var(--acc); color: #fff; font-size: max(16px, calc(var(--u) * 8.5)); line-height: 1.15; animation: fslide .35s ease-out .2s both; }
  @keyframes fslide { from { opacity: 0; transform: translateX(-30%) skewX(-10deg); } to { opacity: 1; } }
  @keyframes fslam { from { opacity: 0; transform: translateX(-20%) scale(1.5) skewX(-6deg); } to { opacity: 1; } }
  @keyframes fpop { from { opacity: 0; transform: scale(2.2); } to { opacity: 1; transform: scale(1); } }
  @keyframes frise { from { opacity: 0; transform: translateY(40%); } to { opacity: 1; transform: none; } }
  .ftitle { position: absolute; left: 0; right: 0; top: calc(var(--u) * 5); margin: 0; text-align: center; font-size: max(22px, calc(var(--u) * 21)); font-weight: 700; color: #fff27a; letter-spacing: .02em;
    -webkit-text-stroke: calc(var(--u) * 2) #1b1433; paint-order: stroke fill; text-shadow: calc(var(--u) * 1.6) calc(var(--u) * 1.8) 0 #ff7ad9, calc(var(--u) * -1.2) calc(var(--u) * -1) 0 #7ff7ff; animation: fpop .55s cubic-bezier(.2, 1.6, .4, 1) .1s both; }
  .fsub { position: absolute; left: 7%; right: 7%; top: calc(var(--u) * 31); margin: 0; text-align: center; text-wrap: balance; font-size: max(16px, calc(var(--u) * 8)); line-height: 1.12; color: #fff;
    -webkit-text-stroke: calc(var(--u) * 1.4) #1b1433; paint-order: stroke fill; animation: frise .5s ease-out .7s both; }
  .ftag { position: absolute; transform: translateX(-50%); padding: 0 .5em; border-radius: 999px; background: #1b1433d0; border: 1px solid var(--acc); color: #fff; font-size: max(16px, calc(var(--u) * 5.6)); line-height: 1.35; white-space: nowrap; animation: frise .4s ease-out 1.2s both; }
  /* the roll-call card: information tiles (flat), then the buttons */
  .roster .rgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 0 0 12px; }
  .roster .rgrid > div { display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 4px 10px; border-radius: 10px; background: #ffffff0d; opacity: .45; cursor: default; }
  .roster .rgrid > div.on { opacity: 1; box-shadow: inset 6px 0 0 var(--acc); }
  .roster .rgrid > div.cur { background: #ffffff22; }
  .roster canvas { width: 40px; height: 40px; image-rendering: pixelated; flex: none; }
  .roster .rgrid b { font-size: var(--fs-label); font-weight: 700; font-family: var(--font-read); }
  .roster .btns { display: flex; flex-direction: column; gap: 8px; }
  .roster .hint { margin: 8px 0 0; }

  /* a mission (mini-game) opens OUTSIDE the stage and fills the real window: the game scales itself to its own iframe with its own stage.js */
  #missionOverlay { position: fixed; inset: 0; z-index: 20; background: var(--night); }      /* no bar of its own: the game's own header carries the Map button (stage.js) */
  #missionFrame { display: block; width: 100%; height: 100%; border: 0; background: var(--night); }
  html body > #devPanel.inmission { left: auto !important; right: 8px !important; top: auto !important; bottom: 8px !important; }     /* over a mission, the shell's DEV box keeps to the other corner and shows only Close mission */
  #devPanel.inmission > :not(.dev-bar):not(#devClose):not(#devEarn) { display: none !important; }

  /* the DEV box: a direct child of <body>, docked in the strip stage.js leaves above the stage (house.css) */
  .dev { display: flex; flex-wrap: nowrap; gap: 6px; align-items: center; background: #000c; border: 2px dashed var(--yellow); color: var(--yellow); font: 14px system-ui, sans-serif; white-space: nowrap; }
  .dev select, .dev button { font: 14px system-ui, sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  /* the page's sentences beside the picture */
  .ns-info { overflow-y: auto; min-height: 0; justify-content: safe center; }
  .ns-body { grid-template-columns: 640px minmax(0, 1fr); }            /* a little more room for the sentences */
  .ns-info .facts .fact-text { font-size: var(--fs-small, 16px); }
  .ns-says { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
  .ns-says li { font-family: var(--font-read); font-size: 18px; line-height: 1.3; color: var(--ink, #f6f0ff); opacity: .5; padding-left: 12px; border-left: 4px solid transparent; transition: opacity .25s; }
  .ns-says li.heard { opacity: .85; }
  .ns-says li.now { opacity: 1; border-left-color: var(--yellow, #fff27a); }
  .ns-says mark { background: none; color: var(--yellow, #fff27a); font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .ns-says li { transition: none; } }
</style>

<script src="stage.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">

<body>
<div id="app" data-stage class="frame">
  <!-- the header is only the game's name, Voice and New game (owner, 2026-11-15: "i dont understand the navigation at the top") -->
  <header class="hdr">
    <h1 class="hdr-title">Restore Oppy</h1>
    <div class="hdr-ctrls">
      <button class="hbtn" id="voiceBtn" aria-pressed="true" title="Voice on or off (V)">🔊 Voice</button>
      <button class="hbtn" id="newBtn" title="Start the whole adventure again">↺ New game</button>
    </div>
  </header>

  <main class="play">
    <div class="play-board"><div class="cvwrap" id="cvwrap">
      <canvas id="game" width="320" height="200" aria-label="Game picture"></canvas>
      <div id="finale" hidden>
        <div class="fbeat" id="fbeat"></div>
        <div id="fteam" hidden><h2 class="ftitle">CONGRATULATIONS!</h2><p class="fsub">You restored Oppy. The Mars team is back together!</p><div id="ftags"></div></div>
      </div>
      <div id="sites" hidden>
        <div id="mapTop" class="info" aria-label="Progress"><div class="slots" id="slots"></div><span class="cnt digits" id="cnt"></span></div>
        <div id="playWrap" hidden><button class="go" id="playBtn">Play ▶</button><span class="arrow" aria-hidden="true"></span></div>
        <button class="btn-replay" id="teamAgain" hidden>Meet the Mars team again</button>
      </div>
    </div></div>
    <div class="play-ctrls" id="side"></div>
    <section class="storyfull" id="nasaStory" hidden aria-live="polite"></section>
  </main>

  <footer>
    <canvas id="portrait" width="40" height="40" aria-hidden="true"></canvas>
    <div><div class="who" id="who"></div><div class="line" id="line" aria-live="polite"></div></div>
    <div class="cap-btns">
      <button class="toolbtn" id="backBtn" hidden title="Previous line (B)">◀ Back</button>
      <button class="next" id="nextBtn" data-cap-next hidden>Next ▶</button>
    </div>
  </footer>

  <div class="overlay" id="cardOverlay" hidden><div class="box" id="cardBox"></div></div>

  <div id="startOverlay">
    <canvas id="titleCv" aria-hidden="true"></canvas>
    <div class="ttl" role="heading" aria-level="1">Restore Oppy</div>
    <p class="sub">An imaginary adventure starring real space explorers. The missions and discoveries you uncover really happened.</p>
    <div class="acts">
      <div class="row"><button class="go" id="startBtn">Start ▶</button><button class="btn-replay" id="newGameBtn" hidden>New game</button></div>
      <p class="hintline">Turn your sound on! Press <kbd>Enter</kbd> to go.</p>
    </div>
  </div>
</div>

<div class="dev" id="devPanel" hidden>
  <b>DEV</b>
  <select id="devJump" aria-label="Jump to step">
    <option value="curiosity">Meet Curiosity (NASA story)</option><option value="intro">Intro: whole meet-Oppy scene</option><option value="map0">Map: no parts</option><option value="map2">Map: 2 parts</option>
    <option value="map5">Map: all 5 parts (wakes Oppy by itself)</option><option value="assembly">Oppy wakes up</option><option value="oppyintro">Meet Opportunity (NASA story)</option><option value="story">Oppy's story</option><option value="end">The end</option><option value="finale">Team finale</option>
  </select>
  <button id="devGo">Go</button>

</div>

<!-- the mission overlay: OUTSIDE the scaled stage, fills the real window; the iframe fills the whole window -->

<script>
"use strict";
const A = __ASSETS__;
const PAL = __PAL__;

// =====================================================================================
// The missions. One entry per machine; any order (owner, 2026-11-14: no chapter numbers).
//   file     the mini-game page, next to this one
//   built    true once that page is in prototype/ (until then the place shows "Coming soon")
//   saveKey  the mini-game's own localStorage save; isDone reads it
//   pick/have/back  script IDs of what Curiosity says on the map: the place is chosen, its part is already found, a mission is left unfinished
//   at       place on the 320 x 200 map (about where it really is on Mars; nudged so buttons do not overlap)
// A mini-game can also tell the shell it is finished:
//   parent.postMessage({ type: "restore-oppy:mission-complete", mission: "<id>" }, location.origin)
// =====================================================================================
const MISSIONS = [
  { id: "phoenix", name: "Phoenix", game: "The Clue That Vanished", where: "The far north of Mars · 2008", at: [48, 38],
    pick: "shell.pick.010", have: "shell.have.010", back: "shell.back.020", part: "Robotic arm", pk: "arm", fact: "Oppy's real arm had a rock grinder and three science tools.",
    file: "phoenix.html", built: true, saveKey: "phx.progress", isDone: v => !!v?.done },
  { id: "sojourner", name: "Sojourner", game: "Track Detective", where: "Ares Vallis · 1997", at: [106, 72],
    pick: "shell.pick.020", have: "shell.have.020", back: "shell.back.030", part: "Wheels", pk: "wheels", fact: "Oppy rolled on six aluminium wheels with cleats for grip.",
    file: "track-detective.html", built: true, saveKey: "td.progress", isDone: v => !!v?.p3?.done },
  { id: "parachute", name: "Chute", game: "The Secret in the Stripes", where: "Jezero Crater · 2021", at: [206, 56],
    pick: "shell.pick.030", have: "shell.have.030", back: "shell.back.040", part: "Camera mast", pk: "mast", fact: "Oppy's camera eyes sat on a mast about 1.5 m above the ground.",
    file: "secret-in-the-stripes.html", built: true, saveKey: "pc.progress", isDone: v => !!v?.p3?.done },
  { id: "ingenuity", name: "Ingenuity", game: "Flight Plan", where: "Jezero Crater · 2021", at: [232, 114],
    pick: "shell.pick.040", have: "shell.have.040", back: "shell.back.050", part: "Solar panels", pk: "panels", fact: "Solar panels turned sunlight into power for Oppy.",
    file: "ingenuity-flight-plan.html", built: true, saveKey: "fp.progress", isDone: v => !!v?.p3?.done },
  { id: "insight", name: "InSight", game: "Whisper Beneath Mars", where: "Landed November 2018", at: [288, 76],
    pick: "shell.pick.050", have: "shell.have.050", back: "shell.back.060", part: "High-gain antenna", pk: "antenna", fact: "This dish let Oppy talk to Earth and listen for commands.",
    file: "insight.html", built: true, saveKey: "ins.progress", isDone: v => !!v?.done },
];
// Part names are the real Opportunity parts (owner, 2026-11-15). stories.js still carries its old `reward` names; they are not used here.
const HOME = { id: "oppy", name: "Oppy", at: [160, 130] };                    // Meridiani Planum, where Opportunity landed
const nextMission = () => MISSIONS.find(m => m.built && !has(m.id)) || null;       // the next unfinished mission
const byId = id => MISSIONS.find(m => m.id === id);

// ---------- save ----------
const SAVE = "oppy.hub";
function loadProgress() {
  let v = null; try { v = JSON.parse(localStorage.getItem(SAVE)); } catch {}
  return { intro: false, parts: {}, assembled: false, story: false, ...(v || {}) };
}
function saveProgress() { try { localStorage.setItem(SAVE, JSON.stringify(P)); } catch {} }
function gameDone(m) { try { return m.isDone(JSON.parse(localStorage.getItem(m.saveKey))); } catch { return false; } }
let P = loadProgress();
const has = id => !!P.parts[id];
const partsFound = () => MISSIONS.filter(m => has(m.id)).length;
function syncParts() {                            // a mission finished in its own page counts too
  let fresh = [];
  for (const m of MISSIONS) if (!has(m.id) && !S.ignoreSaves && gameDone(m)) { P.parts[m.id] = true; fresh.push(m); }
  if (fresh.length) saveProgress();
  return fresh;
}

// ---------- images ----------
const img = {};
const load = k => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = A[k].src; img[k] = i; });
const tag = (sheet, name) => A[sheet].tags.find(t => t.name === name);
const frameOf = (sheet, name, now, ms = 300) => { const t = tag(sheet, name); return t.from + Math.floor(now / ms) % (t.to - t.from + 1); };

// ---------- canvas ----------
// Two sizes, both at a WHOLE-NUMBER scale of their pixels on the 1280 x 720 stage (the stage scales the whole page as one unit).
// The scenes (intro, workshop, story, end, finale) are a fixed 320 x 200 picture at 2x. The MAP has no side panel, so it fills the
// main area (1248 x 524): as many canvas pixels as fit at the largest whole-number K (crisp), wider than 320 x 200 (owner, 2026-11-15).
// The backing store holds real screen pixels: css size x stage.scale x devicePixelRatio, re-fitted on "stage:fit".
const cv = document.getElementById("game");
let cx = cv.getContext("2d");
let NW = 320, NH = 200;
const GROUND = 156;
let SCALE = 2, PX = 2, K = 2;
const MAIN_W = 1248, MAIN_H = 524, SIDE_W = 560 + 16;               // the main area of the frame (house.css tokens), and the controls column with its gap
const isMapPhase = () => S.phase === "map" || S.phase === "mission";
const screenK = () => (window.stage ? stage.scale : 1) * (window.devicePixelRatio || 1);     // backing pixels per design pixel
function fit() {
  const main = document.querySelector("main"), side = document.getElementById("side"), wrap = document.getElementById("cvwrap");
  const hasSide = side.childElementCount > 0 && !isMapPhase();
  if (!hasSide && side.childElementCount && isMapPhase()) { side.innerHTML = ""; return; }      // (the observer calls fit() again)
  main.classList.toggle("solo", !hasSide);
  const h = MAIN_H, w = MAIN_W - (hasSide ? SIDE_W : 0);
  if (isMapPhase()) {
    K = Math.max(1, Math.floor(Math.min(w / 440, h / 205)));      // about 440-520 x 205-250 canvas pixels at whole-number K
    NW = Math.floor(w / K); NH = Math.floor(h / K); SCALE = K;
  } else { NW = 320; NH = 200; SCALE = Math.max(1, Math.floor(Math.min(w / NW, h / NH))); }
  const k = screenK(), wantW = Math.round(NW * SCALE * k), wantH = Math.round(NH * SCALE * k);
  if (cv.width !== wantW || cv.height !== wantH) { cv.width = wantW; cv.height = wantH; }
  cv.style.width = NW * SCALE + "px"; cv.style.height = NH * SCALE + "px";
  PX = SCALE * k; cx.imageSmoothingEnabled = false;
  wrap.style.setProperty("--u", SCALE + "px"); wrap.style.setProperty("--k", SCALE);      // the finale's text and the map's labels scale with the picture
  if (isMapPhase()) layoutMap();
}
const snap = v => Math.round(v * PX) / PX;
addEventListener("stage:fit", () => { fit(); fitTitle(); });
new MutationObserver(() => fit()).observe(document.getElementById("side"), { childList: true });     // a card arriving in (or leaving) the side panel re-lays the scene out beside it

// ---------- state ----------
const S = { phase: "start", parts: [], fast: false, ignoreSaves: false, sel: null, mission: null, cp: null, driving: null, busy: false, waking: false,
  cur: { x: -40, anim: "idle", show: false }, oppy: { anim: "off", wake: 0 },
  fitted: {} };

// ---------- voice + captions ----------
// Every spoken line is in script/restore-oppy.script.js: LINE(id, vars) gives { id, who, text }. voice.js speaks it: the
// recording in audio/ if there is one, else the computer voice (contract: .claude/script-contract.md).
let nextResolve = null, speaker = "curiosity";
const isTalking = now => Voice.talking(now);
function say(line, { next = false, back = false } = {}) {     // line = LINE(id), or a step of several lines (Voice.step, packSteps)
  speaker = line.who;
  document.getElementById("who").textContent = Voice.name(line.who);
  document.getElementById("line").textContent = line.text;      // one size: captions.js pages a long line (the shell no longer shrinks it)
  Voice.speak(line);
  const nb = document.getElementById("nextBtn"), bb = document.getElementById("backBtn");
  if (nextResolve && !next) { const r = nextResolve; nextResolve = null; r("skip"); }
  if (!next) { nb.hidden = true; bb.hidden = true; return Promise.resolve("next"); }
  nb.hidden = false; bb.hidden = !back; nb.focus({ preventScroll: true });     // (captions.js keeps Next hidden until the line is shown; it is focused again then)
  return new Promise(res => { nextResolve = (v = "next") => { nb.hidden = true; bb.hidden = true; nextResolve = null; res(v); }; });
}
async function lines(list) {                     // a little conversation, [LINE(...), ...]; Back goes to the previous step; a speaker's consecutive lines share a step when they fit in two caption lines
  list = packConvo(list);
  for (let i = 0; i < list.length;) {
    const r = await say(list[i], { next: true, back: i > 0 });
    if (r === "skip") return;
    i = r === "back" ? Math.max(0, i - 1) : i + 1;
  }
}
document.addEventListener("caption:done", () => { const nb = document.getElementById("nextBtn"); if (!nb.hidden && !document.getElementById("cardOverlay").offsetParent) nb.focus({ preventScroll: true }); });
document.getElementById("nextBtn").onclick = () => nextResolve && nextResolve("next");
document.getElementById("backBtn").onclick = () => nextResolve && nextResolve("back");
const voiceBtn = document.getElementById("voiceBtn");
Voice.button(voiceBtn);                                  // 🔊 / 🔇 Voice: on and off for the recordings and the computer voice (?mute=1 starts off)

const pv = document.getElementById("portrait"), pxc = pv.getContext("2d"); pxc.imageSmoothingEnabled = false;
const PORTRAIT = { sojourner: "sojourner", phoenix: "phoenix", insight: "insight", chute: "parachute", ingenuity: "ingenuity" };
function drawPortrait(now) {
  const talking = isTalking(now);
  pxc.clearRect(0, 0, 40, 40);
  if (speaker === "oppy") {                       // Oppy: its camera head, cropped from the body sheet
    const f = talking ? frameOf("oppy", "talk", now, 140) : tag("oppy", "idle").from;
    pxc.drawImage(img.oppy, f * 64 + 29, 0, 28, 13, 1, 10, 38, 18); return;
  }
  if (PORTRAIT[speaker]) { pxc.save(); pxc.translate(0, talking && Math.floor(now / 140) % 2 ? -1 : 0); ICON[PORTRAIT[speaker]](pxc); pxc.restore(); return; }   // the finale's other speakers
  const t = tag("curiosity", talking ? "talk" : "idle");
  let f = t.from; if (talking) f += Math.floor(now / 140) % (t.to - t.from + 1); else if (now % 2800 > 2650) f = t.to;
  pxc.drawImage(img.curiosity, f * 40, 0, 40, 40, 0, 0, 40, 40);
}

// ---------- cards ----------
let cardResolve = null;
function showCard(html, buttons = [["Next ▶", "go"]]) {     // resolves with the index of the button pressed
  const ov = document.getElementById("cardOverlay"), box = document.getElementById("cardBox");
  box.innerHTML = html + `<div class="row">${buttons.map(([t, c], i) => `<button class="${c}" data-i="${i}">${t}</button>`).join("")}</div>`;
  ov.hidden = false;
  const btns = [...box.querySelectorAll(".row button")]; btns[0].focus({ preventScroll: true });
  return new Promise(res => {
    cardResolve = (i = 0) => { if (!cardResolve) return; cardResolve = null; ov.hidden = true; res(i); };
    btns.forEach(b => { b.onclick = () => cardResolve && cardResolve(+b.dataset.i); });
  });
}

// ---------- helpers ----------
const wait = ms => new Promise(r => setTimeout(r, S.fast ? Math.min(ms, 30) : ms));
function tween(ms, fn) { if (S.fast) { fn(1); return Promise.resolve(); } return new Promise(res => { const t0 = performance.now(); const step = now => { const k = Math.min(1, (now - t0) / ms); fn(k); k < 1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); }); }
function sparkle(x, y, n = 18) { const cs = [PAL.neonPink, PAL.neonCyan, PAL.neonYellow, PAL.neonLime, "#ffffff"]; for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 0.4 + Math.random(); S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.4, life: 30 + Math.random() * 20, c: cs[i % cs.length] }); } }
function stepParts() { for (const p of S.parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life--; cx.fillStyle = p.c; cx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); } S.parts = S.parts.filter(p => p.life > 0); }
function txt(s, x, y, c = "#fff", size = 8, align = "center", g = cx) { g.fillStyle = c; g.font = `${size}px 'Jersey 15', monospace`; g.textAlign = align; g.fillText(s, x, y); }
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function ell(g, x, y, rx, ry, c, top = false) {     // pixel ellipse; top = only the upper half (a dome)
  g.fillStyle = c;
  for (let dy = -ry; dy <= (top ? 0 : ry); dy++) { const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry)))); g.fillRect(Math.round(x - hw), Math.round(y + dy), hw * 2, 1); }
}
function offscreen(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); g.imageSmoothingEnabled = false; draw(g); return c; }
const tagLabel = (s, x, y, w, bg = PAL.neonYellow) => { cx.fillStyle = bg; cx.fillRect(x, y, w, 12); txt(s, x + w / 2, y + 9, PAL.night, 8); };

// =====================================================================================
// Icons (40 x 40). Sojourner, Phoenix's scoop and Oppy use the games' own sprites.
// Ingenuity and the parachute too. InSight is a stand-in until that game brings its art.
// =====================================================================================
function eyes(g, x, y) { for (const dx of [0, 8]) { g.fillStyle = PAL.eye; g.fillRect(x + dx, y, 5, 6); g.fillStyle = PAL.pupil; g.fillRect(x + dx + 2, y + 2, 3, 4); g.fillStyle = PAL.shine; g.fillRect(x + dx + 2, y + 2, 1, 1); } }
const ICON = {
  sojourner: g => g.drawImage(img.sojourner, 0, 0, 40, 40, 0, 0, 40, 40),
  phoenix: g => g.drawImage(img.phoenixScoop, 0, 0, 40, 40, 0, 0, 40, 40),
  oppy: g => { const c = offscreen(64, 56, h => paintOppy(h, 0, 0, earnedNow())); g.drawImage(c, 0, 14, 64, 38, 0, 8, 40, 24); },   // Oppy as it is now: base + earned layers
  insight: g => {                                   // SEIS under its dome-shaped shield
    ell(g, 20, 29, 15, 14, PAL.outline, true); ell(g, 20, 29, 14, 13, PAL.metal, true); ell(g, 17, 26, 8, 8, PAL.metalHi, true);
    g.fillStyle = PAL.outline; g.fillRect(4, 29, 32, 6); g.fillStyle = PAL.metalMid; g.fillRect(5, 30, 30, 4);
    eyes(g, 13, 20);
    g.fillStyle = PAL.neonCyan; [[8, 8], [10, 6], [12, 8], [14, 10], [16, 8], [18, 4], [20, 8], [22, 11], [24, 8], [26, 6], [28, 8], [30, 8]].forEach(([x, y]) => g.fillRect(x, y, 2, 2));
  },
  parachute: g => g.drawImage(img.chute, 2 * 64, 0, 64, 64, 0, 0, 40, 40),
  curiosity: g => g.drawImage(img.curiosity, 0, 0, 40, 40, 0, 0, 40, 40),
  oppyFull: g => g.drawImage(img.oppyParts, 6 * 64, 14, 64, 38, 0, 8, 40, 24),       // Oppy with every part on
  ingenuity: g => g.drawImage(img.ingenuity, 0, 0, 40, 40, 0, 0, 40, 40),
};
function icon(id) { return offscreen(40, 40, g => ICON[id](g)); }
function iconInto(el, id) { const g = el.getContext("2d"); g.imageSmoothingEnabled = false; g.clearRect(0, 0, el.width, el.height); (ICON[id] || (g2 => partIcon(g2, id)))(g); }
// The real Opportunity parts (art/out/oppy-parts.png, frames 64 x 56: base, wheels, arm, antenna, mast, panels, complete).
// Draw `base`, then each earned part's layer at the same x, y: no gaps, and all five equal the `complete` frame.
const PART_FRAME = { base: 0, wheels: 1, arm: 2, antenna: 3, mast: 4, panels: 5, complete: 6 };
const PART_BOX = { wheels: [2, 38, 57, 17], arm: [50, 27, 13, 14], antenna: [2, 3, 16, 17], mast: [33, 0, 24, 21], panels: [1, 21, 62, 5] };   // from oppy-parts-anchors.json
const PART_ORDER = ["wheels", "arm", "antenna", "mast", "panels"];
const earnedNow = () => Object.fromEntries(MISSIONS.map(m => [m.id, has(m.id)]));
function paintOppy(g, x, y, earned) {              // earned: map keyed by mission id
  const keys = MISSIONS.filter(m => earned[m.id]).map(m => m.pk), fr = k => g.drawImage(img.oppyParts, PART_FRAME[k] * 64, 0, 64, 56, x, y, 64, 56);
  if (keys.length === MISSIONS.length) return fr("complete");
  fr("base"); PART_ORDER.filter(k => keys.includes(k)).forEach(fr);
}
// A part's picture for the tray: a 24 x 16 window of its own layer, drawn on a light tile, shown at exactly 3x (72 x 48) in the CSS.
// The solar panels are a thin strip, so they are drawn on top of the deck (the base frame) instead of alone.
const PART_WIN = { wheels: [2, 38], arm: [40, 26], antenna: [0, 3], mast: [33, 0], panels: [1, 16] };
function partIcon(g, pk) {
  const [wx, wy] = PART_WIN[pk]; g.fillStyle = "#efe3cf"; g.fillRect(0, 0, 24, 16);
  if (pk === "panels") g.drawImage(img.oppyParts, PART_FRAME.base * 64 + wx, wy, 24, 16, 0, 0, 24, 16);
  g.drawImage(img.oppyParts, PART_FRAME[pk] * 64 + wx, wy, 24, 16, 0, 0, 24, 16);
}

// =====================================================================================
// Scenes drawn on the canvas
// =====================================================================================
function drawLand(dark = 0) {
  const g = cx.createLinearGradient(0, 0, 0, GROUND); g.addColorStop(0, PAL.night); g.addColorStop(1, "#4a2a6e");
  cx.fillStyle = g; cx.fillRect(0, 0, NW, GROUND);
  cx.fillStyle = "#ffffff"; for (let i = 0; i < 40; i++) cx.fillRect((i * 83) % NW, (i * 47) % (GROUND - 50), 1, 1);
  cx.fillStyle = "#7a2f4a"; for (let x = 0; x < NW; x += 2) { const h = 14 + 8 * Math.sin(x / 31) + 5 * Math.sin(x / 11 + 2); cx.fillRect(x, GROUND - h, 2, h); }
  cx.fillStyle = PAL.sand; cx.fillRect(0, GROUND, NW, NH - GROUND);
  cx.fillStyle = PAL.sandLight; cx.fillRect(0, GROUND, NW, 2);
  cx.fillStyle = PAL.sandDark; for (let i = 0; i < 26; i++) cx.fillRect((i * 59) % NW, GROUND + 6 + (i * 23) % 36, 3, 1);
  if (dark) { cx.fillStyle = `rgba(27,20,51,${dark})`; cx.fillRect(0, 0, NW, NH); }
}
function shadow(x, y, rx, ry = 3) { cx.fillStyle = "rgba(60,16,30,.35)"; cx.beginPath(); cx.ellipse(x + 3, y, rx, ry, 0, 0, 7); cx.fill(); }
const HUBS = [12, 32, 52];
// Oppy at (x, y) = top-left of its 64 x 56 sprite, s = scale. earned: map keyed by mission id (the layers to show)
function drawOppy(now, x, y, s, anim, { rolling = false, earned = {} } = {}) {
  const hop = anim === "happy" ? -Math.abs(Math.sin(now / 160)) * 2 : rolling && Math.floor(now / 110) % 2 ? -1 : 0;
  cx.save(); cx.translate(snap(x), snap(y + hop)); cx.scale(s, s);
  paintOppy(cx, 0, 0, earned);
  cx.restore();
}
const curIdle = now => tag("curiosityFull", "idle").from + (now % 3000 > 2850 ? 1 : 0);     // eyes open, a short blink (frame 1 is the closed-eyes frame)
function curiosityAt(now, x, base, s, anim) {         // Curiosity centred on x, wheels on base, scale s (the same sprite everywhere it is shown)
  const f = anim === "idle" ? curIdle(now) : frameOf("curiosityFull", anim, now, anim === "drive" ? 110 : anim === "talk" ? 140 : 400);
  shadow(x, base, 26 * s, 3 * s);
  cx.drawImage(img.curiosityFull, f * 64, 0, 64, 56, snap(x - 32 * s), snap(base - 55 * s), 64 * s, 56 * s);
}
// Real size order (owner, 2026-11-15): wherever Curiosity and Oppy stand together, Oppy is about 0.58 of Curiosity's length, on the same ground line.
const CUR_BIG = 1.9, OPPY_BIG = 1.1;                  // the two close-up scales (1.1 / 1.9 = 0.58)
const OPPY_RATIO = 0.58;
function drawCuriosity(now) {
  const C = S.cur; if (!C.show) return;
  const anim = C.anim === "idle" && speaker === "curiosity" && isTalking(now) ? "talk" : C.anim;
  curiosityAt(now, C.x, GROUND + 1, 1, anim);
}

// --- intro: Curiosity finds a dusty rover ---
function drawIntro(now) {
  drawLand();
  if (S.hideOppy) { drawCuriosity(now); stepParts(); return; }       // Curiosity is still introducing itself: Oppy is not found yet
  const O = S.oppy, anim = O.anim === "idle" && speaker === "oppy" && isTalking(now) ? "talk" : O.anim, s = OPPY_RATIO, ox = 218;
  shadow(ox, GROUND + 1, 20, 2.5);
  drawOppy(now, ox - 32 * s, GROUND + 4 - 56 * s, s, anim);
  ell(cx, ox, GROUND + 4, 24, 5, PAL.sandLight); ell(cx, ox - 4, GROUND + 6, 20, 4, PAL.sand);       // a drift of sand over its legs
  drawCuriosity(now);
  stepParts();
}

// --- the map of Mars (owner, 2026-11-15) ---
// A hub: Oppy's home sits in the middle and five winding trails curl out from it, one to each mission's flag
// ("it can be multiple line all from oppy"). Each site is a flag post with its machine standing beside it (no disc behind it).
// Curiosity is drawn last, ON a trail, and drives out along the chosen trail (and back to Oppy for the wake-up).
const ORDER = ["oppy", ...MISSIONS.map(m => m.id)];                                     // home first, then the missions
const MAPN = { oppy: [0.50, 0.70], phoenix: [0.19, 0.44], sojourner: [0.22, 0.87], parachute: [0.75, 0.40], ingenuity: [0.78, 0.87], insight: [0.88, 0.64] };   // fractions of the map
const TURN = { phoenix: 1, sojourner: -1, parachute: 1, ingenuity: 1, insight: 1 };                  // which way each trail bends first
const FLAGC = { oppy: "#ffffff", phoenix: "#ffab6b", sojourner: "#b8ff7a", parachute: "#ff7ad9", ingenuity: "#7ff7ff", insight: "#c6a8ff" };
const NAME = id => (byId(id) || HOME).name;
const PLAY_LIFT = 48;                                                                    // the Play button's arrow tip is this far above a flag's foot
const REST = 40;                                                                         // Curiosity waits this far before a flag, on its trail
const HOME_REST = 52;                                                                    // ...and this far to the right of Oppy's flag when it is at home
let MAP = null, R = null;
const sitePos = id => [MAPN[id][0] * NW, MAPN[id][1] * NH];

// Frame loop, keys, start
// =====================================================================================
function render(now) {
  cx.setTransform(PX, 0, 0, PX, 0, 0); cx.imageSmoothingEnabled = false;
  if (S.phase === "start") { drawTitle(now); drawPortrait(now); requestAnimationFrame(render); return; }
  if (S.phase === "intro") drawIntro(now);
  else if (S.phase === "map" || S.phase === "mission") drawMap(now);
  else if (S.phase === "workshop") drawWorkshop(now);
  else if (S.phase === "end") drawEnd(now);
  else if (S.phase === "finale") drawFinale(now);
  else { drawLand(); }
  drawPortrait(now);
  requestAnimationFrame(render);
}
addEventListener("keydown", e => {
  if (e.target.closest?.("select, input")) return;
  const k = e.key;
  if (k === "`") { document.getElementById("devPanel").hidden ^= 1; return; }
  if (S.phase === "mission") return;
  if (!document.getElementById("cardOverlay").hidden) return;             // a card is open: its own buttons take Enter
  if (S.phase === "start") { if ((k === "Enter" || k === " ") && e.target.tagName !== "BUTTON") { e.preventDefault(); begin(); } return; }
  if (k === "v" || k === "V") return voiceBtn.click();
  if ((k === "b" || k === "B") && nextResolve && !document.getElementById("backBtn").hidden) return nextResolve("back");
  if (S.phase === "finale") {                       // roll-call: Space, Enter or → goes to the next machine; team shot: Enter = Play again
    if (FIN.mode === "roll" && (k === "Enter" || k === " " || k === "ArrowRight")) { e.preventDefault(); return finAdvance(); }
    if (FIN.mode === "team" && k === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); return document.getElementById("finAgain")?.click(); }
    return;
  }
  if (nextResolve && (k === "Enter" || k === " ")) { e.preventDefault(); return nextResolve("next"); }
  if (S.phase === "map") {
    if (S.driving) { if (k === "Enter" || k === " " || k === "Escape") { e.preventDefault(); skipDrive(); } return; }     // the drive is short and skippable
    if (S.busy) return;
    const order = ORDER.filter(playable), arrows = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    if (arrows[k]) { e.preventDefault(); const i = order.indexOf(S.sel); return select(order[(i + arrows[k] + order.length) % order.length] ?? order[0]); }
    if (k === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); return play(); }
  }
});
