<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Detective</title>
<!-- Prototype. Generated by tools/make_sprites.mjs from track-detective.template.html: edit the template. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
<style>
  /* Track Detective on the scaled stage (owner, 2026-11-15): every size is a design pixel on the 1280 x 720 stage.
     The frame (header, step banner, main, caption bar), the buttons, tiles, cards and story chrome come from house.css. */
  :root {
    --night: #1b1433; --night2: #2e2357; --panel: #261c48; --ink: #f6f0ff; --muted: #b9acdf;
    --pink: #ff7ad9; --cyan: #7ff7ff; --lime: #b8ff7a; --yellow: #fff27a; --lav: #c6a8ff; --orange: #ffab6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font-family: "Jersey 15", system-ui, sans-serif; font-size: 20px;
    background:
      radial-gradient(2px 2px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(2px 2px at 78% 12%, #7ff7ffaa 50%, transparent 51%),
      radial-gradient(2px 2px at 44% 82%, #ff7ad9aa 50%, transparent 51%),
      radial-gradient(2px 2px at 90% 70%, #fff8 50%, transparent 51%),
      radial-gradient(2px 2px at 30% 55%, #fff5 50%, transparent 51%),
      linear-gradient(180deg, #1b1433 0%, #2a1d52 60%, #3b2266 100%);
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: var(--ink); }
  button:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }

  /* ---------- the board ---------- */
  canvas#game { border-radius: 14px; box-shadow: 0 0 0 3px #7ff7ff55, 0 0 40px #ff7ad944; background: var(--night); }
  .card { background: #261c48cc; border: 0; border-radius: 16px; padding: var(--card-pad); }
  .label { color: var(--muted); font-size: var(--fs-label); margin: 0 0 8px; }
  .label:empty { display: none; }

  /* ---------- your plan: filled steps are buttons (tap one to change it), empty steps are information ---------- */
  .plan { display: grid; grid-template-columns: repeat(8, 56px); gap: 8px; }
  .slot { width: 56px; height: 56px; padding: 0; line-height: 1; font-size: 30px; position: relative; color: var(--accent, var(--ink)); background: #ffffff14; }
  .slot.empty { border: 0; border-radius: var(--radius); background: #00000033; box-shadow: none; cursor: default; }
  .slot.F { --accent: var(--lime); } .slot.B { --accent: var(--cyan); } .slot.P, .slot.O { --accent: var(--lav); } .slot.I { --accent: var(--yellow); }
  .slot.is-sel { color: #1b1433; }
  .slot.run { box-shadow: 0 0 18px currentColor; transform: translateY(-3px); }
  .slot.bad { border-color: var(--orange); background: #ffab6b30; }
  .slot.bad::after { content: "✕"; position: absolute; right: -8px; top: -8px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    font: 700 16px/1 var(--font-read); background: var(--orange); color: #1b1433; }
  .slot.dim { opacity: .3; }
  .slot svg { width: 28px; height: 28px; display: block; margin: auto; }
  .deg { position: absolute; right: 3px; bottom: 2px; font: 700 16px/1 var(--font-read); color: currentColor; pointer-events: none; }
  .note { min-height: 26px; margin: 8px 0 0; font-size: var(--fs-body); line-height: 1.3; color: var(--lav); }
  .note:empty { min-height: 0; margin: 0; }

  /* ---------- the controls: five move keys and a tall GO on top, Undo / Clear / Hint below ---------- */
  .controls { display: grid; grid-template-columns: repeat(5, 72px) minmax(0, 1fr); grid-template-rows: 64px var(--h-btn-tool); gap: 8px; }
  .controls .pad, .controls .actions { display: contents; }
  .controls .actions > div { grid-column: 1 / span 5; grid-row: 2; display: flex; gap: 8px; }   /* Undo / Clear / Hint: one width each */
  .key { width: 100%; height: 100%; padding: 0; min-width: 0; color: var(--accent); background: #ffffff10; font-size: 36px; }
  .key svg { width: 40px; height: 40px; display: block; margin: auto; }
  .key .deg { right: 5px; bottom: 4px; }
  .key.P { grid-column: 1; grid-row: 1; --accent: var(--lav); }
  .key.F { grid-column: 2; grid-row: 1; --accent: var(--lime); }
  .key.B { grid-column: 3; grid-row: 1; --accent: var(--cyan); }
  .key.O { grid-column: 4; grid-row: 1; --accent: var(--lav); }
  .key.I { grid-column: 5; grid-row: 1; --accent: var(--yellow); }
  .key.flash { transform: translateY(2px); box-shadow: 0 1px 0 var(--depth); filter: brightness(1.4); }
  .key.nudge { animation: nudge .5s ease-in-out infinite alternate; }
  @keyframes nudge { to { transform: rotate(25deg) scale(1.08); } }
  .point { animation: pointMe .6s ease-in-out infinite alternate; }   /* "press this one": a pulsing yellow ring, never over another control */
  @keyframes pointMe { from { outline: 3px solid #fff27a00; outline-offset: 2px; } to { outline: 4px solid var(--yellow); outline-offset: 5px; } }
  .controls .go { grid-column: 6; grid-row: 1 / span 2; height: auto; min-height: 0; padding: 0 12px; }
  .controls .toolbtn { flex: 1 1 0; height: var(--h-btn-tool); min-height: 0; padding: 0 4px; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* ---------- solved panel ---------- */
  .solved { text-align: center; }
  .solvedmsg { font-size: var(--fs-body); margin: 0 0 12px; }
  .solvedmsg .eq { font-family: var(--font-display); font-weight: 700; color: var(--lime); font-size: var(--fs-heading); }
  .solved .btn-next { height: var(--h-btn-primary); animation: nextGlow 1.3s ease-in-out infinite alternate; }
  @keyframes nextGlow { from { box-shadow: 0 5px 0 #2e8a49, 0 0 16px #b8ff7a77; } to { box-shadow: 0 5px 0 #2e8a49, 0 0 36px #b8ff7add; } }

  /* ---------- caption bar (sizes in house.css) ---------- */
  #portrait { border-radius: 12px; background: #2e2357; }
  .who { color: var(--cyan); font-weight: 700; }
  .line.again { animation: again .5s; }
  @keyframes again { 0% { color: var(--yellow); } 100% { color: var(--ink); } }
  .dev { display: flex; gap: 6px; align-items: center; background: #000c; border: 2px dashed var(--yellow); color: var(--yellow); font: 14px system-ui, sans-serif; }
  .dev select, .dev button { font: 14px system-ui, sans-serif; }
  .err { position: fixed; left: 0; right: 0; top: 0; background: #b00020; color: #fff; padding: 8px; z-index: 9; }

  /* ---------- Part 3: the question, its answer tiles, and the two scene buttons ---------- */
  .qbig { margin: 0 0 14px; font-size: var(--fs-heading); line-height: 1.2; color: var(--yellow); text-shadow: 0 0 10px #fff27a55; animation: qIn .4s ease-out both; }
  .answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .answer { padding: 8px 8px 10px; background: #ffffff10; color: var(--ink); font-family: var(--font-read); font-size: var(--fs-body); display: flex; flex-direction: column; align-items: center; gap: 6px; animation: ansIn .4s ease-out both; }
  .answer canvas { width: 128px; height: 88px; image-rendering: pixelated; display: block; border-radius: 8px; background: #e8643c; }
  .answer .n { position: absolute; left: -10px; top: -12px; width: 30px; height: 30px; border-radius: 50%; background: var(--lav); color: #1b1433; font: 700 18px/1 var(--font-read); display: grid; place-items: center; }
  .answer.right { --accent: var(--lime); background: #b8ff7a33; }
  .answer.crossed { animation: shake .35s both; opacity: .5; text-decoration: line-through; --accent: var(--orange); box-shadow: none; cursor: not-allowed; }
  .answers .answer:nth-child(2) { animation-delay: .08s; } .answers .answer:nth-child(3) { animation-delay: .16s; }
  .answers.waiting .answer:not(.crossed) { animation: ansIn .4s ease-out both, ansPulse 1.5s ease-in-out .6s infinite; }
  .answers.waiting .answer:nth-child(2) { animation-delay: .08s, .8s; } .answers.waiting .answer:nth-child(3) { animation-delay: .16s, 1s; }
  @keyframes qIn { from { opacity: 0; transform: translateY(-14px) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes ansIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes ansPulse { 0%, 100% { box-shadow: 0 4px 0 var(--depth), 0 0 0 0 #7ff7ff00; } 50% { box-shadow: 0 4px 0 var(--depth), 0 0 18px 2px #7ff7ffaa; } }
  .count { font-family: var(--font-read); font-size: var(--fs-heading); color: var(--yellow); text-align: center; margin: 12px 0 0; text-shadow: 0 0 10px #fff27a88; }
  .disc { font-size: var(--fs-small); color: var(--lav) !important; }
  @media (prefers-reduced-motion: reduce) {
    .solved .btn-next, .bd-label, .qbig, .answers .answer, .answers.waiting .answer { animation: none !important; }
  }

  /* ---------- story time: the pixel scene (ILLUSTRATION) on the left, Person 1's NASA photos on the right ---------- */
  .play.story-active { grid-template-columns: 640px minmax(0, 1fr) !important; align-items: stretch !important; }
  .play.story-active .play-ctrls { justify-content: stretch; }
  .play.story-active #p3Panel { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .play.story-active #p3Body { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  .play.story-photos { grid-template-columns: minmax(0, 1fr) !important; }
  .play.story-photos .play-board { display: none; }
  .board-tag { position: absolute; left: 50%; top: 50%; transform: translate(-312px, -192px); }   /* top-left corner of the 640 x 400 scene */
  #p3Body .st-media { flex: 1 1 auto; height: 0; padding: 4px; }
  #p3Body .st-fig { height: 100%; justify-content: center; }
  #p3Body .st-frame { flex: 0 1 auto; min-height: 0; display: flex; }
  #p3Body .st-frame img { max-height: 100%; height: auto; width: auto; }
  .play.story-active:not(.story-photos) #p3Body .st-media { grid-auto-flow: row; grid-auto-columns: auto; grid-auto-rows: minmax(0, 1fr); }
  .st-fig { animation: evidence-land 440ms cubic-bezier(.2,.8,.25,1) both; }
  .st-fig:nth-child(2) { animation-delay: 100ms; }
  @keyframes evidence-land { 0% { opacity: 0; transform: translateY(-32px) scale(1.12) rotate(-7deg); } 68% { opacity: 1; transform: translateY(3px) scale(.97) rotate(2deg); } 100% { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .st-fig { animation: none; } }

  /* ---------- fitting and test-drive: the scene keeps the whole main width; its one main action (house.css .main-action) sits centred right under it ---------- */
  .play.act { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: minmax(0, 1fr) auto !important; row-gap: 8px !important; }
  .play.act .play-ctrls { display: flex !important; flex-direction: row; justify-content: center; align-items: center; gap: 16px; max-height: none; }
  .play.act #p3Panel { background: none; padding: 0; }
  .play.act #p3Body { display: flex; align-items: center; justify-content: center; gap: 20px; }
  .play.act .count { margin: 0; font-size: var(--fs-heading); }

  /* ---------- cards ---------- */
  .closex { position: absolute; right: -14px; top: -14px; width: 52px; height: 52px; border-radius: 50%; cursor: pointer;
    border: 4px solid #fff3d6; background: radial-gradient(circle at 35% 30%, #ffb07a, #f2672e); color: #fff;
    font: 700 26px/1 system-ui, sans-serif; box-shadow: 0 0 0 3px #1b1433, 0 4px 0 #1b1433, 0 0 18px #ff8a5c88; }
  .closex:hover { filter: brightness(1.1); transform: translateY(-2px); }
  .closex:active { transform: translateY(2px); }
  .closex:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }
  .overlay { display: grid; place-items: center; background: #1b1433dd; z-index: 5; }
  .overlay .box { position: relative; text-align: center; background: var(--panel); border: 3px solid var(--cyan); border-radius: 24px; padding: 24px 36px; box-shadow: 0 0 40px #7ff7ff55; max-width: 680px; }
  .overlay h2 { font-size: var(--fs-heading); margin: 0 0 8px; color: var(--cyan); text-shadow: 0 0 12px #7ff7ff; }
  .overlay p { color: var(--muted); margin: 0 0 16px; }
  .mcard { text-align: left !important; }
  .mcard h2 { text-align: center; }
  .mcard .row { display: flex; justify-content: center; margin-top: 16px; }
  .badge { display: inline-block; font-size: var(--fs-small); padding: 2px 10px; border-radius: 999px; background: #ff7ad933; color: var(--pink); }
  .plist { display: grid; gap: 8px; }
  .plist > div { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; align-items: center; padding: 8px 14px; border-radius: 12px; background: #ffffff10; font-family: var(--font-read); font-size: var(--fs-body); }
  .plist b { color: var(--yellow); }
  .diff { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
  .diff i { width: 14px; height: 14px; border-radius: 3px; background: #ffffff22; display: inline-block; }
  .diff i.on { background: var(--pink); }
  .pinfo { display: flex; justify-content: center; font-family: var(--font-read); font-size: var(--fs-body); margin: 0 0 8px; }


  /* ---------- "Before you drive": the big explainer card (frame in house.css) ---------- */
  .bd-stage canvas { width: 432px; height: 384px; border-radius: 16px; border: 4px solid #1b1433; box-shadow: 0 0 0 3px var(--cyan), 0 0 26px #7ff7ff55; display: block; box-sizing: content-box; }   /* 144 x 128 at 3x */
  .bd-label.P, .bd-label.O { color: var(--lav); } .bd-label.F { color: var(--lime); } .bd-label.B { color: var(--cyan); } .bd-label.I { color: var(--yellow); }
  .bd-find { display: flex; align-items: center; gap: 16px; }
  .rocks4 { display: grid; grid-template-columns: repeat(4, 88px); gap: 8px; margin: 0; }
  .rocks4 figure { margin: 0; text-align: center; }
  .rocks4 img { display: block; width: 80px; height: 80px; image-rendering: pixelated; background: #e8643c; border-radius: 10px; }   /* 40 x 40 at 2x */
  .rocks4 .yes img { filter: drop-shadow(0 0 8px #fff27a); }
  .rocks4 figcaption { font-family: var(--font-read); }
  .mvtiles { width: 488px; }
  .mvtile canvas { width: 144px; height: 128px; }                 /* 144 x 128 at 1x */
  .mvtile.P, .mvtile.O { --accent: var(--lav); color: var(--lav); } .mvtile.F { --accent: var(--lime); color: var(--lime); }
  .mvtile.B { --accent: var(--cyan); color: var(--cyan); } .mvtile.I { --accent: var(--yellow); color: var(--yellow); }
  .mvtile.on { color: #1b1433; }
</style>

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<body>
<div id="app" data-stage class="frame">
  <header class="hdr">
    <h1 class="hdr-title">Track Detective</h1>
    <div class="hdr-ctrls">
      <button class="hbtn hbtn-mission" id="missionBtn" title="See your mission">Your mission</button>
      <button class="hbtn hbtn-icon" id="helpBtn" aria-label="How to play: Before you drive" title="How to play">?</button>
      <button class="hbtn" id="voiceBtn" aria-pressed="true" title="Voice on or off (V)">🔊 Voice</button>
      <button class="hbtn" id="restartBtn" hidden title="Start Sojourner's story again">↺ Restart</button>
    </div>
  </header>
  <div class="stepbar" id="stepbar" aria-live="polite"><span class="step-text" id="stepText"></span><span class="step-sub" id="stepSub"></span></div>

  <main class="play">
    <div class="play-board"><canvas id="game" width="256" height="256" aria-label="Game board"></canvas><span class="st-tag anim board-tag" id="boardTag" hidden>ILLUSTRATION</span></div>

    <div class="play-ctrls">
      <!-- Part 2 -->
      <section class="card" id="p2Panel" hidden>
        <p class="label">Your plan</p>
        <div class="plan" id="plan"></div>
        <div class="note" id="note"></div>
      </section>
      <section class="card solved" id="solvedPanel" hidden>
        <p class="solvedmsg" id="solvedMsg"></p>
        <div class="nextrow"><button class="btn-next go bignext" id="solvedNext">Next puzzle ▶</button>
        <button class="btn-replay" id="solvedReplay">↺ Replay</button></div>
      </section>
      <section class="card" id="p2Controls" hidden>
        <div class="controls">
          <div class="pad" id="pad">
            <button class="key tap P" data-d="P" aria-label="Turn left 90 degrees" title="Turn left 90° (← or Q)">⟲</button>
            <button class="key tap F" data-d="F" aria-label="Forward" title="Forward (↑)">⬆</button>
            <button class="key tap B" data-d="B" aria-label="Reverse" title="Reverse: back up one square (↓)">⬇</button>
            <button class="key tap O" data-d="O" aria-label="Turn right 90 degrees" title="Turn right 90° (→ or E)">⟳</button>
            <button class="key tap I" data-d="I" aria-label="Explore: use the rock tool" title="Explore: the tool on Sojourner's back studies the rock (X)">🔍</button>
          </div>
          <div class="actions">
            <button class="go" id="goBtn" title="Drive the plan (Enter)">GO ▶</button>
            <div>
              <button class="toolbtn" id="undoBtn" title="Erase a move: tap a move in your plan, then Undo (⌫). Nothing picked? It erases the last move."><i class="ico-eraser" aria-hidden="true"></i>Undo</button>
              <button class="toolbtn" id="clearBtn" title="Clear the whole plan">✕ Clear</button>
              <button class="toolbtn" id="hintBtn" title="Hint (H)">💡 Hint</button>
            </div>
          </div>
        </div>
      </section>
      <!-- Part 3 -->
      <section class="card" id="p3Panel" hidden>
        <p class="label" id="p3Label"></p>
        <div id="p3Body"></div>
      </section>
    </div>
  </main>

  <footer>
    <canvas id="portrait" width="40" height="40" aria-hidden="true"></canvas>
    <div><div class="who" id="who"></div><div class="line" id="line" aria-live="polite"></div></div>
    <div class="cap-btns">
      <button class="toolbtn" id="backBtn" hidden title="Previous line (B)">◀ Back</button>
      <button class="next" id="nextBtn" data-cap-next hidden>Next ▶</button>
    </div>
  </footer>

  <div class="overlay" id="cardOverlay" hidden><div class="box mcard" id="cardBox"></div></div>

  <div class="overlay" id="startOverlay">
    <div class="box">
      <h2>Track Detective</h2>
      <p>Sojourner's story. Turn your sound on!</p>
      <p class="disc">An imaginary adventure starring real space explorers.<br>The missions and discoveries you uncover really happened.</p>
      <button class="go" id="startBtn">Start ▶</button>
      <p style="margin:16px 0 0; font-size:var(--fs-small)">or press <kbd>Enter</kbd></p>
    </div>
  </div>
</div>

<div class="dev" id="devPanel" hidden>
  <b>DEV</b>
  <select id="devJump" aria-label="Jump to step">
    <option value="briefing">Fresh start</option><option value="tracks">Part 1: follow the tracks</option>
    <option value="meet">Meet Sojourner</option><option value="before">Before you drive card</option>
    <option value="puzzle1">Puzzle 1</option><option value="puzzle2">Puzzle 2</option><option value="puzzle3">Puzzle 3</option><option value="puzzle4">Puzzle 4</option>
    <option value="check">Part 3: why the rock?</option><option value="story">Story time</option><option value="gift">Gift box</option>
    <option value="bench">Wheel bench</option><option value="drive">Oppy's drive</option>
    <option value="complete">Mission complete</option>
  </select>
  <button id="devGo">Go</button><button id="devReset">Reset save</button>
</div>

  if (anim === "idle" && speaker === "sojourner" && isTalking(now) && has("talk")) anim = "talk";
  const f = frameOfA(sheet, R, now, anim);
  const x = bx(), y = by() - 2, ground = snap(offY() + R.y * T + T - 3);
  shadow(x, ground, Math.max(8, 15 - R.jump), 3);
  const bob = R.anim === "idle" && Math.floor(now / 650) % 2 ? 1 : 0;
  cx.save(); cx.translate(x, snap(y + bob));
  cx.scale(flip * (R.squash ? 1.12 : 1) * R.pop * (R.spin ?? 1), (R.squash ? 0.84 : 1) * R.pop);
  cx.drawImage(img[sheet], f * 40, 0, 40, 40, -20, -40, 40, 40);
  cx.restore();
  const pr = S.probe, pEl = pr ? performance.now() - pr.t0 : -1;
  if (pr && pEl < pr.len) {                        // the rock tool reaches out from its BACK EDGE to touch the rock
    const [dx, dy] = DIRS[HEAD[(R.h + 2) % 4]], k = Math.min(1, pEl / 500);
    let sx0, sy0, full;                            // start where the back of the sprite is, so it never crosses its body
    if (dy === 1) { sx0 = x; sy0 = y - 1; full = 11; }
    else if (dy === -1) { sx0 = x; sy0 = y - 37; full = 9; }
    else { sx0 = x + dx * 19; sy0 = y - 14; full = 9; }
    const len = full * k, ex = sx0 + dx * len, ey = sy0 + dy * len;
    cx.fillStyle = PAL.leg;
    if (dx) cx.fillRect(snap(Math.min(sx0, ex)), snap(sy0 - 1), Math.abs(ex - sx0), 2);
    else cx.fillRect(snap(sx0 - 1), snap(Math.min(sy0, ey)), 2, Math.abs(ey - sy0));
    cx.fillStyle = PAL.neonPink; cx.fillRect(snap(ex - 2), snap(ey - 2), 4, 4);
  }
}

// ---------- developer menu ----------
const QS = new URLSearchParams(location.search);
const DEV = QS.has("dev") && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname); // dev tools only on the developer's own computer, never for players (owner, 2026-11-15: "remove the dev mode")
document.getElementById("devPanel").hidden = !DEV;
if (QS.get("jump")) document.getElementById("devJump").value = QS.get("jump");
document.getElementById("devGo").onclick = () => { location.search = "?dev=1&jump=" + document.getElementById("devJump").value; };
document.getElementById("devReset").onclick = () => { try { localStorage.removeItem("td.progress"); } catch {} location.search = "?dev=1"; };
function devProgress(upto) {                      // pretend everything before a step is done
  const pr = { p1: true, boards: {}, p3: {}, rockIntro: true };
  BOARDS.forEach((b, i) => { if (i < upto) pr.boards[b.id] = { done: true }; });
  S.progress = pr; saveProgress(); renderBoards(); renderMission();
}
async function finishP3() { S.progress.p3.done = true; saveProgress(); renderMission(); await chapterComplete(); }
const JUMP = {
  briefing: () => { S.progress = { p1: false, boards: {}, p3: {} }; startPart1(); },
  tracks: () => { S.progress = { p1: false, boards: {}, p3: {} }; startPart1(); },
  meet: () => { devProgress(0); S.progress.rockIntro = false; S.phase = "p1"; show("p1"); setCanvas(SW, SH); C.show = true; C.x = SOJ_X - 100; followCam(); meetSojourner(); },
  before: async () => { devProgress(0); await rockBriefing(); await puzzlesOverview(); startBoard(0); },
  puzzle1: () => { devProgress(0); startBoard(0); }, puzzle2: () => { devProgress(1); startBoard(1); },
  puzzle3: () => { devProgress(2); startBoard(2); }, puzzle4: () => { devProgress(3); startBoard(3); },
  check: () => { devProgress(4); startPart3(); },
  story: () => { devProgress(4); S.progress.p3 = { check: true }; startPart3(); },
  gift: () => { devProgress(4); S.progress.p3 = { check: true, story: true }; startPart3(); },
  bench: async () => { devProgress(4); S.progress.p3 = { check: true, story: true }; await bench(); await oppyDrive(); finishP3(); },
  drive: async () => { devProgress(4); S.progress.p3 = { check: true, story: true, wheels: true }; O.onBench = false; await oppyDrive(); finishP3(); },
  complete: () => { devProgress(4); S.progress.p3 = { check: true, story: true, wheels: true, done: true }; saveProgress(); chapterComplete(); },
};
async function begin() {
  if (S.phase !== "start") return;
  document.getElementById("startOverlay").hidden = true;
  S.phase = "boot"; renderBoards(); renderMission();
  if (!S.progress.p1) return startPart1();
  const i = BOARDS.findIndex(b => !S.progress.boards[b.id]?.done);
  if (i >= 0) { if (!S.progress.rockIntro) { await rockBriefing(); await puzzlesOverview(); S.progress.rockIntro = true; saveProgress(); } return startBoard(i); }
  if (!S.progress.p3.done) return startPart3();
  startBoard(0); showMissions("MISSION COMPLETE!", "CLOSE");
}
document.getElementById("startBtn").onclick = begin;
Promise.all(["sojournerTurn", "curiosityAngled", "sojournerAngled", "rockKinds", "sojourner", "sojournerFront", "sojournerBack", "curiosity", "curiosityFull", "tiles", "tracks", "wheel", "marker", "oppy", "oppyWheel", "oppyParts", "specialRock", "plainRock"].map(load)).then(() => {
  makeRingGlow(); fit(); renderBoards(); requestAnimationFrame(render);
  if (DEV && QS.get("jump") && JUMP[QS.get("jump")]) {          // developer jump: skip the start screen
    document.getElementById("startOverlay").hidden = true; S.phase = "boot"; JUMP[QS.get("jump")]();
  }
  window.__td = { S, C, O, BOARDS, startPart3, fitWheel, oppyStep, giftReveal, earnedParts, miniDraw, simulate, parse, distances, onCourse, routeFrom, startBoard, hint, addDir, removeSel, undo };   // for testing
});
